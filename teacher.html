<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>헬스트론 출석관리</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --teal:#1F4B43; --teal-light:#2E6459; --amber:#C98A2C; --amber-light:#E3A94E;
    --coral:#C1523D; --cream:#FBF7EF; --sage:#E8EFE9; --ink:#24302C; --line:#DCE3DA; --muted:#748078;
    --vip:#7A4EA8;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{font-family:'Noto Sans KR', sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; padding-bottom:90px;}
  header{background:var(--teal); color:#fff; padding:16px 20px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:20; box-shadow:0 4px 14px rgba(0,0,0,0.12);}
  .stamp{width:46px; height:46px; border-radius:50%; border:2.5px solid var(--amber-light); display:flex; align-items:center; justify-content:center; font-family:'Gowun Dodum', sans-serif; font-size:20px; color:var(--amber-light); flex-shrink:0;}
  header h1{font-family:'Gowun Dodum', sans-serif; font-size:20px; font-weight:400;}
  header .sub{font-size:12px; opacity:0.75; margin-top:2px;}
  .hbtns{margin-left:auto; display:flex; gap:8px;}
  .hbtn{background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#fff; border-radius:8px; padding:8px 12px; font-size:12px; cursor:pointer; font-family:'Noto Sans KR',sans-serif;}
  .status-banner{font-size:12px; text-align:center; padding:7px 12px; border-bottom:1px solid;}
  .status-ok{background:#EAF3EC; color:#2E6449; border-color:#CFE4D4;}
  .status-warn{background:#FCEFE3; color:#8A5A1E; border-color:#EDD8B8;}
  main{max-width:960px; margin:0 auto; padding:20px;}
  .tabbar{position:fixed; bottom:0; left:0; right:0; z-index:20; background:#fff; border-top:1px solid var(--line); display:flex; box-shadow:0 -4px 14px rgba(0,0,0,0.06);}
  .tabbtn{flex:1; padding:12px 4px 10px; text-align:center; border:none; background:none; font-family:'Noto Sans KR',sans-serif; font-size:11px; color:var(--muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .tabbtn .ic{font-size:19px;}
  .tabbtn.active{color:var(--teal); font-weight:700;}
  h2.section-title{font-family:'Gowun Dodum', sans-serif; font-size:19px; color:var(--teal); margin-bottom:14px; font-weight:400;}
  .grid4{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px;}
  .stat{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px;}
  .stat .n{font-family:'Gowun Dodum',sans-serif; font-size:26px; color:var(--teal);}
  .stat .l{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .stat.vip .n{color:var(--vip);}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px;}
  .card h3{font-size:14px; color:var(--teal); margin-bottom:10px; font-weight:700;}
  .row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #F0EEE6; font-size:13px;}
  .row:last-child{border-bottom:none;}
  .row .name{font-weight:700;}
  .row .sub{color:var(--muted); font-size:12px;}
  .badge{display:inline-block; background:var(--sage); color:var(--teal); font-size:11px; padding:2px 8px; border-radius:999px; font-weight:700;}
  .badge.coral{background:#FBEAE6; color:var(--coral);}
  .badge.amber{background:#FCF1DE; color:var(--amber);}
  .badge.vip{background:#F1E9F7; color:var(--vip);}
  .badge-birthday{display:inline-block; background:linear-gradient(135deg,#FF6B93,#FF9A9E); color:#fff; font-size:14px; padding:5px 12px; border-radius:999px; font-weight:800; box-shadow:0 2px 6px rgba(255,107,147,0.5); letter-spacing:0.3px;}
  .btn-mini{background:var(--amber); color:#fff; border:none; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;}
  .btn-mini:active{opacity:0.8;}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:24px 0;}
  input[type=text], input[type=date], input[type=month], input[type=number], select, textarea{width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); font-size:15px; font-family:'Noto Sans KR',sans-serif; background:#fff;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--teal);}
  label.field{display:block; margin-bottom:14px;}
  label.field span{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:700;}
  .check-field{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .check-field input{width:20px; height:20px;}
  .check-field label{font-size:14px;}
  .btn{display:inline-block; padding:13px 20px; border-radius:10px; border:none; font-size:15px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif;}
  .btn-primary{background:var(--teal); color:#fff; width:100%;}
  .btn-amber{background:var(--amber); color:#fff;}
  .btn-ghost{background:#fff; color:var(--teal); border:1.5px solid var(--teal);}
  .btn-block{width:100%;}
  .searchbar{display:flex; gap:8px; margin-bottom:16px;}
  .searchbar input{flex:1;}
  .cust-item{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; cursor:pointer;}
  .cust-item:active{background:var(--sage);}
  .cust-item .info .nm{font-weight:700; font-size:15px;}
  .cust-item .info .meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .session-pick{display:flex; gap:10px; margin:16px 0;}
  .session-pick button{flex:1; padding:16px; border-radius:12px; border:2px solid var(--line); background:#fff; font-size:15px; font-weight:700; color:var(--muted); cursor:pointer;}
  .session-pick button.sel{border-color:var(--teal); background:var(--sage); color:var(--teal);}
  .detail-header h2{font-family:'Gowun Dodum',sans-serif; font-size:22px; color:var(--teal); font-weight:400;}
  .tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .modal-bg{position:fixed; inset:0; background:rgba(36,48,44,0.45); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:#fff; border-radius:18px 18px 0 0; width:100%; max-width:600px; max-height:88vh; overflow-y:auto; padding:22px;}
  .modal-title{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .modal-title h3{font-family:'Gowun Dodum',sans-serif; font-size:19px; color:var(--teal); font-weight:400;}
  .close-x{background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer;}
  .qr-card{background:#fff; border:2px dashed var(--amber-light); border-radius:16px; padding:26px; text-align:center; max-width:320px; margin:0 auto;}
  .qr-card #qrbox{display:flex; justify-content:center; margin:14px 0;}
  .qr-card .cn{font-family:'Gowun Dodum',sans-serif; font-size:20px; color:var(--teal); margin-bottom:4px;}
  .qr-card .cid{font-size:11px; color:var(--muted); letter-spacing:1px;}
  .toast{position:fixed; top:70px; left:50%; transform:translateX(-50%) scale(0.9); background:var(--teal); color:#fff; padding:12px 22px; border-radius:10px; font-weight:700; font-size:14px; opacity:0; transition:.25s; z-index:60; pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%) scale(1);}
  #importFile{display:none;}
  .slot-card{background:#fff; border:1px solid var(--line); border-radius:16px; margin-bottom:14px; overflow:hidden;}
  .slot-head{background:var(--sage); color:var(--teal); padding:12px 18px; font-family:'Gowun Dodum',sans-serif; font-size:19px; display:flex; justify-content:space-between; align-items:center;}
  .slot-head .cnt{font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:700; background:#fff; padding:3px 10px; border-radius:999px;}
  .slot-name{padding:16px 18px; font-size:21px; font-weight:700; border-bottom:1px solid #F0EEE6; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .slot-name:last-child{border-bottom:none;}
  .slot-name:active{background:var(--sage);}
  .slot-name .t{font-size:14px; color:var(--muted); font-weight:400;}

  /* ---- 10인치 태블릿(강사용) 전용: 홈 화면을 스크롤 없이 한 화면에 ---- */
  .dash-grid{display:block;}
  .list-scroll{max-height:none; overflow:visible;}
  @media (min-width:700px){
    body{padding-bottom:60px;}
    header{padding:9px 18px;}
    .stamp{width:36px; height:36px; font-size:16px;}
    header h1{font-size:16px;}
    header .sub{font-size:11px;}
    .status-banner{font-size:11px; padding:4px 12px;}
    main{max-width:1300px; padding:12px 16px 0;}
    h2.section-title{font-size:16px; margin-bottom:8px;}
    .tabbtn{padding:7px 4px 6px; font-size:10.5px;}
    .tabbtn .ic{font-size:17px;}

    .dash-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; align-items:start;}
    .dash-grid .card{margin-bottom:0; padding:11px 13px;}
    .dash-grid .card h3{font-size:13px; margin-bottom:6px;}
    .dash-grid .row{padding:5px 0; font-size:12.5px;}
    .dash-grid .grid4{gap:6px; margin-bottom:0;}
    .dash-grid .stat{padding:9px 6px;}
    .dash-grid .stat .n{font-size:19px;}
    .dash-grid .stat .l{font-size:10px;}
    .dash-grid .empty{font-size:12px; padding:12px 0;}
    .dash-grid .list-scroll{max-height:150px; overflow-y:auto;}
  }
  @media (min-width:1000px){
    .dash-grid{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>
<body>

<div class="status-banner status-warn" id="statusBanner">⏳ 구글시트 연결 확인 중...</div>
<header>
  <div class="stamp">출</div>
  <div><h1>헬스트론 출석관리</h1><div class="sub">강의용</div></div>
  <div class="hbtns">
    <button class="hbtn" onclick="manualRefresh()">🔄 새로고침</button>
    <button class="hbtn" onclick="exportData()">⬇ 백업</button>
    <button class="hbtn" onclick="document.getElementById('importFile').click()">⬆ 불러오기</button>
    <input type="file" id="importFile" accept="application/json">
  </div>
</header>

<main id="main"><div class="empty">불러오는 중...</div></main>

<div class="tabbar">
  <button class="tabbtn" data-tab="home"><span class="ic">🏠</span>홈</button>
  <button class="tabbtn" data-tab="checkin"><span class="ic">✅</span>출석체크</button>
  <button class="tabbtn" data-tab="timeline"><span class="ic">⏰</span>시간대별</button>
  <button class="tabbtn" data-tab="customers"><span class="ic">👥</span>고객관리</button>
  <button class="tabbtn" data-tab="qr"><span class="ic">▦</span>QR발급</button>
  <button class="tabbtn" data-tab="stats"><span class="ic">📊</span>통계</button>
</div>

<div class="toast" id="toast"></div>

<!-- 어느 탭에 있든 QR 스캔이 바로 되도록, 항상 존재하는 보이지 않는 입력창. -->
<input type="text" id="globalScanInput" autocomplete="off"
  style="position:fixed; top:-100px; left:-100px; width:1px; height:1px; opacity:0; padding:0; border:0;"
  onkeydown="handleScanInput(event)">

<script>
/* =========================================================
   0. 구글시트 연동 설정 — 배포한 웹앱 URL을 여기에 붙여넣으세요
   ========================================================= */
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbym1g8ZfBYe9PitQpWaRnRePm5_PEf_l8juk4cMekcwuELZ5AEyTOEG0qjR8r9X0g2I/exec";
const APP_MODE = "viewer"; // "desk"(안내데스크, 전체 기능) 또는 "viewer"(강사용, 열람 전용)
function isViewer(){ return APP_MODE === "viewer"; }

let customers = [];
let currentTab = 'home';
let checkinSession = '오전';

const HEALTH_TAGS = ["혈액순환","무릎/관절","수면","혈압","소화","기타"];
const MODELS = ["JZ9000","LX9000","HC9000","LX4000"];

const KOREAN_HOLIDAYS = new Set([
  "2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-03-02",
  "2026-05-05","2026-05-24","2026-05-25","2026-06-03","2026-06-06",
  "2026-08-15","2026-08-17","2026-09-24","2026-09-25","2026-09-26",
  "2026-10-03","2026-10-05","2026-10-09","2026-12-25"
]);

function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function todayStr(){
  const fresh = window._verifiedTodayStr && window._verifiedTodayStrAt && (Date.now() - window._verifiedTodayStrAt < 10*60*1000);
  if(fresh) return window._verifiedTodayStr;
  const parts = new Intl.DateTimeFormat('ko-KR', {timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(new Date());
  const get = t => parts.find(p=>p.type===t)?.value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}
function daysDiff(fromStr, toStr){
  const a = new Date(fromStr+'T00:00:00');
  const b = new Date(toStr+'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function daysUntilBirthday(birthStr, todayStr_){
  if(!birthStr) return null;
  const mmdd = birthStr.slice(5,10); // MM-DD
  const thisYear = parseInt(todayStr_.slice(0,4),10);
  let next = `${thisYear}-${mmdd}`;
  if(next < todayStr_) next = `${thisYear+1}-${mmdd}`;
  return daysDiff(todayStr_, next);
}
function addDaysStr(dateStr, n){
  let d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) d = new Date(todayStr()+'T00:00:00'); // 잘못된/빈 날짜면 오늘 날짜로 대체
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
const REG_BADGE_START = '2026-09-01';
function isRecentRegBadge(firstVisit, asOfDate){
  if(!firstVisit || firstVisit < REG_BADGE_START) return false;
  const d = new Date(firstVisit+'T00:00:00');
  d.setMonth(d.getMonth()+1);
  const oneMonthLater = d.toISOString().slice(0,10);
  return asOfDate <= oneMonthLater;
}
// 매장 휴무일: 토·일요일 + 2026년 대한민국 법정공휴일(대체공휴일 포함)
// ※ 매장 휴무 정책이 바뀌면 이 목록만 수정하면 됩니다.
const HOLIDAYS_2026 = new Set([
  '2026-01-01', // 신정
  '2026-02-16','2026-02-17','2026-02-18', // 설날 연휴
  '2026-03-02', // 삼일절 대체공휴일(3/1이 일요일)
  '2026-05-05', // 어린이날
  '2026-05-25', // 부처님오신날 대체공휴일(5/24가 일요일)
  '2026-07-17', // 제헌절
  '2026-08-15','2026-08-17', // 광복절 + 대체공휴일(8/15가 토요일)
  '2026-09-24','2026-09-25','2026-09-26', // 추석 연휴
  '2026-10-03','2026-10-05', // 개천절 + 대체공휴일(10/3이 토요일)
  '2026-10-09', // 한글날
  '2026-12-25', // 크리스마스
]);
function isBusinessDay(dateStr){
  const day = new Date(dateStr+'T00:00:00').getDay(); // 0=일,6=토
  if(day===0 || day===6) return false;
  if(HOLIDAYS_2026.has(dateStr)) return false;
  return true;
}
// 특정 날짜(asOfDate) 기준, 주말·공휴일은 건너뛰고 영업일만 따져서 며칠 연속 출석했는지 계산
// 2026-08-31에 모든 고객에게 3만볼트 쿠폰을 일괄 지급했으므로,
// 그 이전 방문기록은 연속출석 계산에서 제외하고 9월 1일부터 새로 카운트함.
const STREAK_RESET_DATE = '2026-09-01';
function currentStreak(c, asOfDate){
  const visitDates = new Set(c.visits.map(v=>v.date));
  let streak = 0;
  let d = asOfDate;
  let guard = 0;
  while(guard++ < 3650){ // 무한루프 방지 안전장치
    if(d < STREAK_RESET_DATE) break; // 기준선 이전 날짜는 계산하지 않음
    if(isBusinessDay(d)){
      if(visitDates.has(d)){
        streak++;
        d = addDaysStr(d, -1);
      } else {
        break;
      }
    } else {
      d = addDaysStr(d, -1); // 휴무일은 건너뛰고 계속 거슬러 올라감(끊김으로 취급 안 함)
    }
  }
  return streak;
}
// 3일 연속(3,6,9...) 출석 달성일인지 여부 → 3만볼트 이용쿠폰 지급 대상
function isCouponDay(c, asOfDate){
  const s = currentStreak(c, asOfDate);
  return s>0 && s%3===0;
}
// 특정 날짜(asOfDate)까지의 누적 출석일수(서로 다른 날짜 기준)
function totalAttendanceDays(c, asOfDate){
  const dates = new Set((c.visits||[]).map(v=>v.date));
  if(!asOfDate) return dates.size;
  return [...dates].filter(d=>d<=asOfDate).length;
}
function lastVisitDate(c){
  if(!c.visits || !c.visits.length) return c.firstVisit || null;
  return c.visits.reduce((max,v)=> v.date>max ? v.date : max, c.visits[0].date);
}
function daysSince(dateStr){
  if(!dateStr) return null;
  const d1 = new Date(dateStr), d2 = new Date(todayStr());
  return Math.round((d2-d1)/86400000);
}
function lastVisit(c){ if(!c.visits.length) return null; return c.visits.map(v=>v.date).sort().slice(-1)[0]; }
function referralCount(name){ return customers.filter(c=>c.referrer && c.referrer.trim()===name.trim()).length; }
function shiftMonth(prefix, delta){
  let [y,m] = prefix.split('-').map(Number);
  m += delta;
  while(m<1){ m+=12; y--; }
  while(m>12){ m-=12; y++; }
  return y + '-' + String(m).padStart(2,'0');
}
function addBusinessDays(startStr, totalDays){
  let d = new Date(startStr+'T00:00:00');
  if(isNaN(d.getTime())) d = new Date(todayStr()+'T00:00:00'); // 잘못된/빈 날짜면 오늘 날짜로 대체
  let count = 0, guard = 0;
  while(guard++ < 10000){
    const dow = d.getDay();
    const ds = d.toISOString().slice(0,10);
    if(dow!==0 && dow!==6 && !KOREAN_HOLIDAYS.has(ds)) count++;
    if(count===totalDays) break;
    d.setDate(d.getDate()+1);
  }
  return d.toISOString().slice(0,10);
}
function threeManEnd(c){
  const start = c.firstVisit || todayStr(); // threeManStart는 더 이상 사용하지 않고, 무조건 첫방문일 기준
  return addBusinessDays(addDaysStr(start, 1), 5); // 등록일 당일은 안 세고, 다음날부터 영업일 5일
}
function ddayBadge(endDate){
  const rem = -daysSince(endDate);
  if(rem>0) return {text:`D-${rem}`, cls:'badge'};
  if(rem===0) return {text:'오늘 마감', cls:'badge amber'};
  return {text:`기간만료 (${-rem}일 지남)`, cls:'badge coral'};
}
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1500);
}

/* ---------------- 구글시트 연동 ---------------- */
function sheetConfigured(){
  return SHEET_API_URL && SHEET_API_URL.startsWith('http');
}
async function syncCustomer(c){
  if(!sheetConfigured()) return;
  try{
    await fetch(SHEET_API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},

function cleanDateStr(v){
  if(!v) return '';
  const s = String(v).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m){
    const y = parseInt(m[1],10);
    if(y < 1900 || y > 2100) return '';
    return m[0].slice(0,10);
  }
  if(/^\d+(\.\d+)?$/.test(s)) return '';
  const d = new Date(s);
  if(isNaN(d.getTime())) return '';
  const y2 = d.getFullYear();
  if(y2 < 1900 || y2 > 2100) return '';
  return d.toISOString().slice(0,10);
}
function cleanPhoneStr(v){
  if(v===undefined || v===null || v==='') return '';
  let digits;
  if(typeof v === 'number'){
    digits = String(Math.trunc(v));
    if(!digits.startsWith('0')) digits = '0'+digits;
  } else {
    digits = String(v).replace(/\D/g,'');
    if(digits && !digits.startsWith('0')) digits = '0'+digits;
  }
  if(digits.length===11 && digits.startsWith('01')) return digits.slice(0,3)+'-'+digits.slice(3,7)+'-'+digits.slice(7);
  if(digits.length===10 && digits.startsWith('01')) return digits.slice(0,3)+'-'+digits.slice(3,6)+'-'+digits.slice(6);
  return digits || String(v).trim();
}
async function fetchCustomersFromSheet(){
  const res = await fetch(SHEET_API_URL + '?action=list');
  const data = await res.json();
  return (data.customers || []).map(c=>{
    let calciumPurchases = (c.calciumPurchases || []).map(cleanDateStr).filter(Boolean);
    if(!calciumPurchases.length && c.calciumDate) calciumPurchases = [cleanDateStr(c.calciumDate)].filter(Boolean);
    const visits = (c.visits || []).map(v=>({...v, date: cleanDateStr(v.date)})).filter(v=>v.date);
    return {
      ...c,
      name: String(c.name || '').trim(),
      phone: cleanPhoneStr(c.phone),
      birth: cleanDateStr(c.birth),
      threeManStart: cleanDateStr(c.threeManStart),
      fiveManDate: cleanDateStr(c.fiveManDate),
      trialStart: cleanDateStr(c.trialStart),
      purchaseDate: cleanDateStr(c.purchaseDate),
      firstVisit: cleanDateStr(c.firstVisit),

}

let sessionManuallySet = false;
async function getKoreaTimeParts(){
  try{
    const res = await fetch('https://worldtimeapi.org/api/timezone/Asia/Seoul');
    const data = await res.json();
    const d = new Date(data.datetime);
    return { hour:d.getHours(), minute:d.getMinutes(), dateStr:data.datetime.slice(0,10) };
  }catch(err){
    const parts = new Intl.DateTimeFormat('ko-KR', {timeZone:'Asia/Seoul', hour12:false, hour:'2-digit', minute:'2-digit', year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(new Date());
    const get = t => parts.find(p=>p.type===t)?.value;
    return { hour: parseInt(get('hour')), minute: parseInt(get('minute')), dateStr: `${get('year')}-${get('month')}-${get('day')}` };
  }
}
async function autoSetSessionByTime(){
  const { hour, minute, dateStr } = await getKoreaTimeParts();
  const prevDate = window._verifiedTodayStr;
  window._verifiedTodayStr = dateStr;
  window._verifiedTodayStrAt = Date.now();
  if(window._lastAutoCheckDate !== dateStr){ window._lastAutoCheckDate = dateStr; sessionManuallySet = false; }
  if(prevDate !== dateStr){ render(); }
  if(sessionManuallySet) return;
  const shouldBePm = (hour > 13) || (hour === 13 && minute >= 30);
  const target = shouldBePm ? '오후' : '오전';
  if(checkinSession !== target){
    checkinSession = target;
    if(currentTab==='checkin') renderCheckin();
  }
}

/* ---------------- QR 스캔 입력 처리 (물리 키 위치 기반) ----------------
   한/영 모드에 따라 글자가 한글로 깨지는 문제를 근본적으로 없애기 위해,
   화면에 찍히는 값(한/영에 따라 달라짐)을 읽는 대신, event.code(물리적으로 어떤 키를
   눌렀는지)를 직접 읽어서 조합함. 이 방식은 한/영 모드가 무엇이든 항상 정확함. */
function scanCodeToChar(code){
  let m = code.match(/^Key([A-Z])$/);
  if(m) return m[1].toLowerCase();
  m = code.match(/^Digit([0-9])$/);
  if(m) return m[1];
  // 주의: Numpad(키패드) 숫자는 일부러 인식하지 않음.
  // 일부 스캐너 기기가 숫자 하나에 대해 "일반 숫자키"와 "키패드 숫자키" 신호를
  // 동시에 두 번 보내는 경우가 있어서, 여기서 Numpad 쪽을 무시해 중복 입력을 원천 차단함.
  return null;
}
function finalizeScan(el){
  const val = el._scanBuffer || '';
  el._scanBuffer = '';
  el.value = '';
  if(!val) return;
  const m = val.match(/c[a-z0-9]{8,}/i);
  const id = m ? m[0] : val;
  const c = customers.find(x=>x.id===id);
  if(!c){ showToast(`등록되지 않은 QR이에요 (스캔값: ${val})`); return; }
  doCheckin(c.id, true);
}
function handleScanInput(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    clearTimeout(e.target._scanTimer);
    finalizeScan(e.target);
    return;
  }
  const ch = scanCodeToChar(e.code);
  if(ch){
    e.preventDefault(); // 한/영 조합(IME)이 끼어들지 않도록 기본 동작 막고, 물리 키값만 직접 사용
    e.target._scanBuffer = (e.target._scanBuffer||'') + ch;
    clearTimeout(e.target._scanTimer);
    // 입력이 잠깐(150ms) 멈추면 Enter 없이도 자동으로 체크인 시도 (스캐너가 Enter를 안 보내는 경우 대응)
    e.target._scanTimer = setTimeout(()=>finalizeScan(e.target), 150);
  }
}
function renderCheckinResults(){

function doCheckin(id, fromScanner){
  if(isViewer()){ showToast('열람 전용 모드에서는 체크인할 수 없어요'); return; }
  const c = customers.find(x=>x.id===id);
  if(!c) return;
  const today = todayStr();
  const already = c.visits.some(v=>v.date===today && v.session===checkinSession);
  if(already){ showToast(`${c.name}님은 이미 ${checkinSession} 출석 완료`); if(fromScanner) refocusScan(); return; }

  // 하루 한 번 출석 원칙: 다른 세션(오전/오후)에 이미 출석했으면 체크인 자체를 막음
  const otherSession = checkinSession==='오전' ? '오후' : '오전';
  const alreadyOtherSession = c.visits.some(v=>v.date===today && v.session===otherSession);
  if(alreadyOtherSession){
    showToast(`⚠️ ${c.name}님은 오늘 ${otherSession}에 이미 출석했어요. 하루 1회만 출석 가능해요.`);
    if(fromScanner) refocusScan();
    return;
  }

  c.visits.push({date:today, session:checkinSession, time:new Date().toTimeString().slice(0,5)});
  showToast(`${c.name}님 ${checkinSession} 출석 완료!`);
  syncCustomer(c);
  const s = document.getElementById('checkinSearch');
  if(s) s.value='';
  renderCheckinResults();
  renderCheckinLog();
  if(fromScanner) refocusScan(); // 손으로 탭한 경우엔 재포커스 안 함(폰에서 가상키보드 뜨는 것 방지)

  if(c.birth){
    const bd = daysUntilBirthday(c.birth, today);
    if(bd===0) showBirthdayAlert(c);
  }
}

function weeklyAttendanceForMonth(c, yearMonthStr){
  const today = todayStr();
  const [y,m] = yearMonthStr.split('-').map(Number);
  const isCurrentMonth = yearMonthStr === today.slice(0,7);
  const todayDay = parseInt(today.slice(8,10),10);
  const daysInMonth = new Date(y, m, 0).getDate();
  const maxDay = isCurrentMonth ? todayDay : daysInMonth;
  const buckets = {};
  for(let d=1; d<=maxDay; d++){
    const b = Math.ceil(d/7);
    buckets[b] = buckets[b] || new Set();
  }
  c.visits.filter(v=>v.date.startsWith(yearMonthStr)).forEach(v=>{
    const day = parseInt(v.date.slice(8,10),10);
    if(day>maxDay) return;
    const b = Math.ceil(day/7);
    buckets[b] = buckets[b] || new Set();
    buckets[b].add(v.date);
  });
  return Object.keys(buckets).map(Number).sort((a,b)=>a-b).map(b=>({week:b, count:buckets[b].size}));
}

/* ---------------- 통계 (월별/연도별) ---------------- */
let statMode = 'month';
let statDay = todayStr();
let statWeek = null;
let statMonth = todayStr().slice(0,7);
let statYear = todayStr().slice(0,4);
function isoWeekStrOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = (d.getDay()+6)%7;
  d.setDate(d.getDate() - dow + 3);
  const firstThursday = new Date(d.getFullYear(),0,4);
  const diff = (d - firstThursday) / 86400000;
  const week = 1 + Math.round(diff/7);
  return `${d.getFullYear()}-W${String(week).padStart(2,'0')}`;
}
function weekRangeFromIsoWeek(isoWeekStr){
  const [y,w] = isoWeekStr.split('-W').map(Number);
  const simple = new Date(y,0,1+(w-1)*7);
  const dow = simple.getDay();
  const start = new Date(simple);
  if(dow<=4) start.setDate(simple.getDate()-dow+1); else start.setDate(simple.getDate()+8-dow);
  const end = new Date(start); end.setDate(start.getDate()+6);
  return {start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10)};
}
statWeek = isoWeekStrOf(todayStr());
function inStatRange(dateStr){
  if(!dateStr) return false;
  if(statMode==='day') return dateStr===statDay;
  if(statMode==='week'){ const r=weekRangeFromIsoWeek(statWeek); return dateStr>=r.start && dateStr<=r.end; }
  if(statMode==='month') return dateStr.startsWith(statMonth);
  return dateStr.startsWith(statYear);
}
function statRangeLabel(){
  if(statMode==='day') return statDay;
  if(statMode==='week'){ const r=weekRangeFromIsoWeek(statWeek); return `${statWeek} (${r.start} ~ ${r.end})`; }
  if(statMode==='month') return statMonth;
  return statYear;
}

// weekIndex번째 주(등록일 기준)에 4일 이상 출석했는지 확인
function attendedInWeek(c, weekIndex){
  const start = addDaysStr(c.firstVisit, (weekIndex-1)*7);
  const end = addDaysStr(c.firstVisit, weekIndex*7 - 1);
  const dates = new Set(c.visits.filter(v=>v.date>=start && v.date<=end).map(v=>v.date));
  return dates.size >= 4;
}
function computeRetentionWindow(cohort, weekIndex){
  const today = todayStr();
  const dayThreshold = weekIndex*7 - 1;
  const eligible = cohort.filter(c => daysDiff(c.firstVisit, today) >= dayThreshold);
  const retained = eligible.filter(c => attendedInWeek(c, weekIndex));
  return {
    total: eligible.length,
    retained: retained.length,
    rate: eligible.length ? Math.round(retained.length/eligible.length*1000)/10 : null
  };
}
function computeRetention(prefix){
  const cohort = customers.filter(c=>c.firstVisit && c.firstVisit.startsWith(prefix));
  const w2 = computeRetentionWindow(cohort, 2);
  const w4 = computeRetentionWindow(cohort, 4);
  const w8 = computeRetentionWindow(cohort, 8);

  const today = todayStr();
  const monthPlusCustomers = cohort.filter(c => daysDiff(c.firstVisit, today) >= 30);
  const absentees = monthPlusCustomers.map(c=>{
    const lv = lastVisitDate(c);
    const gap = lv ? daysDiff(lv, today) : null;
    return {c, lv, gap};
  }).filter(x=>x.gap!==null && x.gap>=5).sort((a,b)=>b.gap-a.gap);

  return {w2, w4, w8, absentees};
}

    <div class="card" style="border:2px solid var(--amber-light);">
      <h3>📈 신규 고객 리텐션 (이 기간 등록자 기준)</h3>
      <div class="row"><span class="sub">2주 이상 출석 (2주차에 주4일↑)</span><span>${rateTxt(ret.w2)}</span></div>
      <div class="row"><span class="sub">한 달 이상 출석 (4주차에 주4일↑)</span><span>${rateTxt(ret.w4)}</span></div>
      <div class="row"><span class="sub">두 달 이상 출석 (8주차에 주4일↑)</span><span>${rateTxt(ret.w8)}</span></div>
      <div class="sub" style="margin-top:8px; font-size:12px; color:var(--muted);">※ 아직 해당 주차가 지나지 않은 고객은 전체인원에서 제외됩니다.</div>
    </div>

    <div class="card" style="border:2px solid #E8B4B8;">
      <h3>⚠️ 한 달 이상 다닌 고객 중 5일 이상 연속 결석</h3>
      ${ret.absentees.length ? ret.absentees.map(x=>`
        <div class="row"><span class="name">${x.c.name}</span><span class="sub" style="color:#C0392B;">${x.gap}일째 미방문 (마지막 ${x.lv})</span></div>
      `).join('') : '<div class="empty">해당하는 고객이 없어요</div>'}
    </div>` : ''}

    <button class="btn btn-amber btn-block" onclick="exportStatsCsv()">⬇ 이 기간 방문기록 엑셀(CSV)로 내보내기</button>
  `;
}
function exportStatsCsv(){
  const visitsInRange = customers.flatMap(c=>c.visits.filter(v=>inStatRange(v.date)).map(v=>({...v, cust:c}))).sort((a,b)=>a.date.localeCompare(b.date));
  let csv = '\uFEFF날짜,시간대,고객명,전화번호,소개자,VIP여부\n';
  visitsInRange.forEach(v=>{ csv += `${v.date},${v.session},${v.cust.name},${v.cust.phone},${v.cust.referrer||''},${v.cust.purchased?'VIP':'일반'}\n`; });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `헬스트론_방문기록_${statRangeLabel().replace(/[^0-9A-Za-z가-힣~()-]/g,'_')}.csv`; a.click();
  URL.revokeObjectURL(url);
  showToast('CSV 파일이 다운로드됐어요');
}

/* ---------------- 시간대별 (30분 단위) ---------------- */
let timelineDate = todayStr();

function timeSlotLabel(timeStr){
  if(!timeStr) return '시간 미기록';
  const [h,m] = timeStr.split(':').map(Number);
  const slotM = m<30 ? 0 : 30;
  let endH = h, endM = slotM===0 ? 30 : 0;
  if(slotM===30) endH = h+1;
  const pad = n=>String(n).padStart(2,'0');
  return `${pad(h)}:${pad(slotM)} ~ ${pad(endH)}:${pad(endM)}`;
}
function timeSlotSortKey(label){
  if(label==='시간 미기록') return 9999;
  const [hh,mm] = label.split('~')[0].trim().split(':').map(Number);
  return hh*60+mm;
}
function renderTimeline(){
  document.getElementById('main').innerHTML = `
    <h2 class="section-title">시간대별 출석 (30분 단위)</h2>
    <div class="card"><label class="field"><span>조회할 날짜</span><input type="date" id="timelineDateInput" value="${timelineDate}" onchange="timelineDate=this.value; renderTimelineBody();"></label></div>
    <div id="timelineBody"></div>
  `;
  renderTimelineBody();
}
function toggleVisitConfirmed(customerId, date, session){
  const c = customers.find(x=>x.id===customerId);
  if(!c) return;
  const v = c.visits.find(x=>x.date===date && x.session===session);
  if(!v) return;
  v.confirmed = !v.confirmed;
  syncCustomer(c);
  renderTimelineBody();
}
function renderTimelineBody(){
  const box = document.getElementById('timelineBody');
  const visits = customers.flatMap(c=>c.visits.filter(v=>v.date===timelineDate).map(v=>({...v, cust:c})));
  if(!visits.length){ box.innerHTML = '<div class="empty">이 날짜에 출석한 고객이 없어요</div>'; return; }

  // 이 날짜 방문자 중 3일 연속 출석(3,6,9...) 쿠폰 대상자 요약
  const couponToday = [...new Map(visits.map(v=>[v.cust.id, v.cust])).values()]
    .filter(c=>isCouponDay(c, timelineDate))
    .map(c=>({c, streak:currentStreak(c, timelineDate)}));

  const groups = {};
  visits.forEach(v=>{
    const label = timeSlotLabel(v.time);
    if(!groups[label]) groups[label] = [];
    groups[label].push(v);
  });
  const labels = Object.keys(groups).sort((a,b)=>timeSlotSortKey(b)-timeSlotSortKey(a)); // 최신 시간대가 위로

  box.innerHTML = `
    <div class="card" style="border:2px solid var(--amber-light); background:#FFFDF7;">
      <h3>🎟️ 오늘 3만볼트 쿠폰 대상자 (${couponToday.length}명)</h3>
      ${couponToday.length ? couponToday.map(x=>`
        <div class="row"><span class="name">${x.c.name} ${x.c.purchased?'<span class="badge vip">VIP</span>':''}</span><span class="sub">${x.streak}일 연속</span></div>
      `).join('') : '<div class="empty">오늘 쿠폰 대상자가 없어요</div>'}
    </div>
  ` + labels.map(label=>{
    const list = groups[label].sort((a,b)=>(b.time||'').localeCompare(a.time||'')); // 최근에 출석한 사람이 위로
    const confirmedCount = list.filter(v=>v.confirmed).length;
    return `<div class="slot-card">
      <div class="slot-head"><span>🕐 ${label}</span><span class="cnt">${confirmedCount}/${list.length}명 확인</span></div>
      ${list.map(v=>`<div class="slot-name" style="${v.confirmed?'opacity:0.55;':''}">
        <span onclick="openCustomerDetail('${v.cust.id}')" style="cursor:pointer; ${v.confirmed?'text-decoration:line-through;':''}">${v.cust.name} ${v.cust.purchased?'<span class="badge vip">VIP</span>':''} ${isCouponDay(v.cust, v.date)?`<span class="badge amber">🎟️ 3일연속(${currentStreak(v.cust, v.date)}일)</span>`:''} ${(v.cust.birth && daysUntilBirthday(v.cust.birth, v.date)===0)?'<span class="badge-birthday">🎂 생일</span>':''} ${(v.cust.calciumPurchases||[]).includes(v.date)?`<span class="badge amber">💊 오늘구매(누적${v.cust.calciumPurchases.length})</span>`:((v.cust.calciumPurchases||[]).length?`<span class="badge">💊 누적${v.cust.calciumPurchases.length}</span>`:'')} ${!v.cust.purchased && (v.cust.threeManStart||v.cust.firstVisit) && v.date<=threeManEnd(v.cust) ? `<span class="badge" style="background:#E3F2FD; color:#1565C0;">🆕 3만볼트 이용가능(~${threeManEnd(v.cust)})</span>` : ''} ${v.cust.firstVisit ? (isRecentRegBadge(v.cust.firstVisit, v.date) ? `<span class="badge" style="background:#E6F1FB; color:#0C447C;">🆕 등록 ${v.cust.firstVisit}</span>` : `<span style="font-size:12px; color:var(--muted);">등록 ${v.cust.firstVisit}</span>`) : ''}</span>
        <span style="display:flex; align-items:center; gap:8px;">
          <span class="t">${v.time||''}</span>
          <button class="btn-mini" style="background:${v.confirmed?'#7BAE7F':'#ccc'};" onclick="event.stopPropagation(); toggleVisitConfirmed('${v.cust.id}','${v.date}','${v.session}')">${v.confirmed?'✅ 확인됨':'⬜ 확인'}</button>
        </span>
      </div>`).join('')}
    </div>`;
  }).join('');
}

/* ---------------- 백업 / 불러오기 (수동 보조용) ---------------- */
function exportData(){
  const blob = new Blob([JSON.stringify({customers}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `헬스트론_고객백업_${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);
  showToast('백업 파일이 다운로드됐어요');
}
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const loaded = JSON.parse(ev.target.result);
      customers = loaded.customers || [];
      render();
      showToast('데이터를 불러왔어요 (구글시트에는 자동 반영 안 됨)');
    }catch(err){ alert('파일을 읽을 수 없어요. 올바른 백업 파일인지 확인해주세요.'); }
  };
  reader.readAsText(file);
});

/* ---------------- 시작 ---------------- */
loadFromSheet();
</script>
