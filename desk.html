<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>헬스트론 출석관리</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --teal:#1F4B43; --teal-light:#2E6459; --amber:#C98A2C; --amber-light:#E3A94E;
    --coral:#C1523D; --cream:#FBF7EF; --sage:#E8EFE9; --ink:#24302C; --line:#DCE3DA; --muted:#748078;
    --vip:#7A4EA8;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{font-family:'Noto Sans KR', sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; padding-bottom:90px;}
  header{background:var(--teal); color:#fff; padding:16px 20px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:20; box-shadow:0 4px 14px rgba(0,0,0,0.12);}
  .stamp{width:46px; height:46px; border-radius:50%; border:2.5px solid var(--amber-light); display:flex; align-items:center; justify-content:center; font-family:'Gowun Dodum', sans-serif; font-size:20px; color:var(--amber-light); flex-shrink:0;}
  header h1{font-family:'Gowun Dodum', sans-serif; font-size:20px; font-weight:400;}
  header .sub{font-size:12px; opacity:0.75; margin-top:2px;}
  .hbtns{margin-left:auto; display:flex; gap:8px;}
  .hbtn{background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#fff; border-radius:8px; padding:8px 12px; font-size:12px; cursor:pointer; font-family:'Noto Sans KR',sans-serif;}
  .status-banner{font-size:12px; text-align:center; padding:7px 12px; border-bottom:1px solid;}
  .status-ok{background:#EAF3EC; color:#2E6449; border-color:#CFE4D4;}
  .status-warn{background:#FCEFE3; color:#8A5A1E; border-color:#EDD8B8;}
  main{max-width:960px; margin:0 auto; padding:20px;}
  .tabbar{position:fixed; bottom:0; left:0; right:0; z-index:20; background:#fff; border-top:1px solid var(--line); display:flex; box-shadow:0 -4px 14px rgba(0,0,0,0.06);}
  .tabbtn{flex:1; padding:12px 4px 10px; text-align:center; border:none; background:none; font-family:'Noto Sans KR',sans-serif; font-size:11px; color:var(--muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .tabbtn .ic{font-size:19px;}
  .tabbtn.active{color:var(--teal); font-weight:700;}
  h2.section-title{font-family:'Gowun Dodum', sans-serif; font-size:19px; color:var(--teal); margin-bottom:14px; font-weight:400;}
  .grid4{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px;}
  .stat{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px;}
  .stat .n{font-family:'Gowun Dodum',sans-serif; font-size:26px; color:var(--teal);}
  .stat .l{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .stat.vip .n{color:var(--vip);}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px;}
  .card h3{font-size:14px; color:var(--teal); margin-bottom:10px; font-weight:700;}
  .row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #F0EEE6; font-size:13px;}
  .row:last-child{border-bottom:none;}
  .row .name{font-weight:700;}
  .row .sub{color:var(--muted); font-size:12px;}
  .badge{display:inline-block; background:var(--sage); color:var(--teal); font-size:11px; padding:2px 8px; border-radius:999px; font-weight:700;}
  .badge.coral{background:#FBEAE6; color:var(--coral);}
  .badge.amber{background:#FCF1DE; color:var(--amber);}
  .badge.vip{background:#F1E9F7; color:var(--vip);}
  .badge-birthday{display:inline-block; background:linear-gradient(135deg,#FF6B93,#FF9A9E); color:#fff; font-size:14px; padding:5px 12px; border-radius:999px; font-weight:800; box-shadow:0 2px 6px rgba(255,107,147,0.5); letter-spacing:0.3px;}
  .btn-mini{background:var(--amber); color:#fff; border:none; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;}
  .btn-mini:active{opacity:0.8;}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:24px 0;}
  input[type=text], input[type=date], input[type=month], input[type=number], select, textarea{width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); font-size:15px; font-family:'Noto Sans KR',sans-serif; background:#fff;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--teal);}
  label.field{display:block; margin-bottom:14px;}
  label.field span{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:700;}
  .check-field{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .check-field input{width:20px; height:20px;}
  .check-field label{font-size:14px;}
  .btn{display:inline-block; padding:13px 20px; border-radius:10px; border:none; font-size:15px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif;}
  .btn-primary{background:var(--teal); color:#fff; width:100%;}
  .btn-amber{background:var(--amber); color:#fff;}
  .btn-ghost{background:#fff; color:var(--teal); border:1.5px solid var(--teal);}
  .btn-block{width:100%;}
  .searchbar{display:flex; gap:8px; margin-bottom:16px;}
  .searchbar input{flex:1;}
  .cust-item{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; cursor:pointer;}
  .cust-item:active{background:var(--sage);}
  .cust-item .info .nm{font-weight:700; font-size:15px;}
  .cust-item .info .meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .session-pick{display:flex; gap:10px; margin:16px 0;}
  .session-pick button{flex:1; padding:16px; border-radius:12px; border:2px solid var(--line); background:#fff; font-size:15px; font-weight:700; color:var(--muted); cursor:pointer;}
  .session-pick button.sel{border-color:var(--teal); background:var(--sage); color:var(--teal);}
  .detail-header h2{font-family:'Gowun Dodum',sans-serif; font-size:22px; color:var(--teal); font-weight:400;}
  .tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .modal-bg{position:fixed; inset:0; background:rgba(36,48,44,0.45); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:#fff; border-radius:18px 18px 0 0; width:100%; max-width:600px; max-height:88vh; overflow-y:auto; padding:22px;}
  .modal-title{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .modal-title h3{font-family:'Gowun Dodum',sans-serif; font-size:19px; color:var(--teal); font-weight:400;}
  .close-x{background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer;}
  .qr-card{background:#fff; border:2px dashed var(--amber-light); border-radius:16px; padding:26px; text-align:center; max-width:320px; margin:0 auto;}
  .qr-card #qrbox{display:flex; justify-content:center; margin:14px 0;}
  .qr-card .cn{font-family:'Gowun Dodum',sans-serif; font-size:20px; color:var(--teal); margin-bottom:4px;}
  .qr-card .cid{font-size:11px; color:var(--muted); letter-spacing:1px;}

  /* ---- 폼텍 라벨지 일괄 인쇄 ----
     실제 라벨지 제품에 맞추려면 아래 grid-template-columns 칸수와
     .label-cell의 크기, .label-sheet의 gap/padding만 조정하면 됩니다. */
  .label-sheet{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4mm 3mm;
    padding: 8mm 5mm;
    max-width: 210mm; /* A4 폭 */
    margin: 0 auto;
  }
  .label-cell{
    border: 1px dashed #ddd; /* 화면 확인용 안내선(인쇄시 자동 숨김) */
    border-radius: 4px;
    padding: 3mm;
    text-align: center;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    break-inside: avoid;
  }
  .label-name{ font-size:11px; font-weight:700; color:var(--teal); margin-bottom:2mm; }
  .label-qrbox{ display:flex; justify-content:center; }
  @media print{
    header, .tabbar, .searchbar, #qrList, .status-banner { display:none !important; }
    .label-cell{ border-color: transparent; }
    body{ padding:0; }
    main{ padding:0; max-width:none; }
  }
  .toast{position:fixed; top:70px; left:50%; transform:translateX(-50%) scale(0.9); background:var(--teal); color:#fff; padding:12px 22px; border-radius:10px; font-weight:700; font-size:14px; opacity:0; transition:.25s; z-index:60; pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%) scale(1);}
  #importFile{display:none;}
  .slot-card{background:#fff; border:1px solid var(--line); border-radius:16px; margin-bottom:14px; overflow:hidden;}
  .slot-head{background:var(--sage); color:var(--teal); padding:12px 18px; font-family:'Gowun Dodum',sans-serif; font-size:19px; display:flex; justify-content:space-between; align-items:center;}
  .slot-head .cnt{font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:700; background:#fff; padding:3px 10px; border-radius:999px;}
  .slot-name{padding:16px 18px; font-size:21px; font-weight:700; border-bottom:1px solid #F0EEE6; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .slot-name:last-child{border-bottom:none;}
  .slot-name:active{background:var(--sage);}
  .slot-name .t{font-size:14px; color:var(--muted); font-weight:400;}

  /* ---- 24인치 모니터(안내데스크) 전용: 홈 화면을 스크롤 없이 한 화면에 ---- */
  .dash-grid{display:block;}
  .list-scroll{max-height:none; overflow:visible;}
  @media (min-width:1200px){
    body{padding-bottom:58px;}
    header{padding:8px 22px;}
    .stamp{width:34px; height:34px; font-size:15px;}
    header h1{font-size:15px;}
    header .sub{font-size:10.5px; margin-top:0;}
    .status-banner{font-size:10.5px; padding:3px 12px;}
    main{max-width:1760px; padding:12px 22px 0;}
    h2.section-title{font-size:15px; margin-bottom:8px;}
    .tabbar{}
    .tabbtn{padding:6px 4px 5px; font-size:10px; gap:1px;}
    .tabbtn .ic{font-size:15px;}

    .dash-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; align-items:start;}
    .dash-grid .card{margin-bottom:0; padding:10px 12px;}
    .dash-grid .card h3{font-size:11.5px; margin-bottom:5px;}
    .dash-grid .row{padding:4px 0; font-size:11.5px;}
    .dash-grid .grid4{gap:5px; margin-bottom:0;}
    .dash-grid .stat{padding:8px 6px;}
    .dash-grid .stat .n{font-size:17px;}
    .dash-grid .stat .l{font-size:9px;}
    .dash-grid .empty{font-size:11px; padding:10px 0;}
    .dash-grid .list-scroll{max-height:118px; overflow-y:auto;}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="status-banner status-warn" id="statusBanner">⏳ 구글시트 연결 확인 중...</div>
<header>
  <div class="stamp">출</div>
  <div><h1>헬스트론 출석관리</h1><div class="sub">안내데스크</div></div>
  <div class="hbtns">
    <button class="hbtn" onclick="manualRefresh()">🔄 새로고침</button>
    <button class="hbtn" onclick="exportData()">⬇ 백업</button>
    <button class="hbtn" onclick="document.getElementById('importFile').click()">⬆ 불러오기</button>
    <input type="file" id="importFile" accept="application/json">
  </div>
</header>

<main id="main"><div class="empty">불러오는 중...</div></main>

<div class="tabbar">
  <button class="tabbtn" data-tab="home"><span class="ic">🏠</span>홈</button>
  <button class="tabbtn" data-tab="checkin"><span class="ic">✅</span>출석체크</button>
  <button class="tabbtn" data-tab="timeline"><span class="ic">⏰</span>시간대별</button>
  <button class="tabbtn" data-tab="customers"><span class="ic">👥</span>고객관리</button>
  <button class="tabbtn" data-tab="qr"><span class="ic">▦</span>QR발급</button>
  <button class="tabbtn" data-tab="stats"><span class="ic">📊</span>통계</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   0. 구글시트 연동 설정 — 배포한 웹앱 URL을 여기에 붙여넣으세요
   ========================================================= */
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbym1g8ZfBYe9PitQpWaRnRePm5_PEf_l8juk4cMekcwuELZ5AEyTOEG0qjR8r9X0g2I/exec";
const APP_MODE = "desk"; // "desk"(안내데스크, 전체 기능) 또는 "viewer"(강사용, 열람 전용)
function isViewer(){ return APP_MODE === "viewer"; }

let customers = [];
let currentTab = 'home';
let checkinSession = '오전';

const HEALTH_TAGS = ["혈액순환","무릎/관절","수면","혈압","소화","기타"];
const MODELS = ["JZ9000","LX9000","HC9000","LX4000"];

const KOREAN_HOLIDAYS = new Set([
  "2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-03-02",
  "2026-05-05","2026-05-24","2026-05-25","2026-06-03","2026-06-06",
  "2026-08-15","2026-08-17","2026-09-24","2026-09-25","2026-09-26",
  "2026-10-03","2026-10-05","2026-10-09","2026-12-25"
]);

/* ---------------- 전극쿠폰(3/6전극 번갈아 지급) ----------------
   등록일부터 영업일(주말·공휴일 제외) 20일씩 6구간으로 나누어,
   각 구간에서 15일 이상 방문하면 쿠폰 지급 (1,3,5구간=3전극 / 2,4,6구간=6전극).
   구간이 하나 지나가도 다음 구간은 별개로 다시 판정됨(연속 조건 없음). */
const ELECTRODE_SEGMENT_DAYS = 20;
const ELECTRODE_THRESHOLD = 15;
const ELECTRODE_MAX_SEGMENTS = 6;
function computeElectrodeSegments(c, asOfDate){
  if(!c.firstVisit || isNaN(new Date(c.firstVisit+'T00:00:00').getTime())) return [];
  const segs = [];
  let prevEnd = null;
  for(let i=1; i<=ELECTRODE_MAX_SEGMENTS; i++){
    const start = i===1 ? c.firstVisit : addDaysStr(prevEnd, 1);
    const end = addBusinessDays(c.firstVisit, i*ELECTRODE_SEGMENT_DAYS);
    const attended = new Set((c.visits||[]).filter(v=>v.date>=start && v.date<=end).map(v=>v.date)).size;
    const complete = asOfDate >= end;
    const eligible = complete && attended >= ELECTRODE_THRESHOLD;
    segs.push({index:i, start, end, attended, complete, eligible, type: i%2===1?'3전극':'6전극'});
    prevEnd = end;
  }
  return segs;
}
// 현재 진행 중인 구간의 진행률 (이미 6구간 다 지났으면 null)
function electrodeCurrentProgress(c, asOfDate){
  const segs = computeElectrodeSegments(c, asOfDate);
  const current = segs.find(s=>!s.complete);
  if(!current) return null;
  const attendedSoFar = new Set((c.visits||[]).filter(v=>v.date>=current.start && v.date<=asOfDate).map(v=>v.date)).size;
  let bizDaysSoFar = 0, d = current.start, guard = 0;
  while(d<=asOfDate && guard++ < 400){ // 400일 넘게 걸리면 데이터가 이상한 것 → 안전하게 중단
    const dow = new Date(d+'T00:00:00').getDay();
    if(dow!==0 && dow!==6 && !KOREAN_HOLIDAYS.has(d)) bizDaysSoFar++;
    d = addDaysStr(d,1);
  }
  return {...current, attendedSoFar, bizDaysSoFar};
}
// 오늘 막 마감되면서 조건을 달성한 구간(팝업/배지용)
function electrodeJustCompletedToday(c, asOfDate){
  return computeElectrodeSegments(c, asOfDate).filter(s=>s.eligible && s.end===asOfDate);
}
window._seenElectrodeAlerts = window._seenElectrodeAlerts || new Set();
function checkElectrodeCouponAlerts(){
  const today = todayStr();
  (customers||[]).filter(Boolean).forEach(c=>{
    try{
      if(!c.firstVisit) return;
      electrodeJustCompletedToday(c, today).forEach(s=>{
        const key = c.id + '_elec' + s.index;
        if(window._seenElectrodeAlerts.has(key)) return;
        window._seenElectrodeAlerts.add(key);
        showElectrodeCouponAlert(c, s);
      });
    }catch(err){
      console.error('전극쿠폰 체크 에러 (고객:'+((c&&c.name)||(c&&c.id)||'알수없음')+'):', err);
    }
  });
}
function showElectrodeCouponAlert(c, seg){
  const wrap = document.createElement('div');
  wrap.className = 'modal-bg';
  wrap.innerHTML = `
    <div class="modal" style="text-align:center; border-top:6px solid #6B8E7F;">
      <div style="font-size:40px; margin:8px 0;">🦵</div>
      <h3 style="margin:0 0 8px;">${c.name}님 ${seg.index}구간 달성!</h3>
      <div class="sub" style="color:var(--muted); margin-bottom:16px;">${seg.start} ~ ${seg.end} 중 ${seg.attended}일 방문 ${c.purchased?'· <span class="badge vip">VIP</span>':''}</div>
      <div style="background:#F3F7F5; border:1px solid #D5E3DC; border-radius:10px; padding:12px; text-align:left; font-size:14px; margin-bottom:16px;">
        <b>${seg.type} 체험쿠폰</b>을 지급해주세요.
      </div>
      <button class="btn btn-primary btn-block" onclick="this.closest('.modal-bg').remove()">지급 완료</button>
    </div>
  `;
  document.body.appendChild(wrap);
}
function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysDiff(fromStr, toStr){
  const a = new Date(fromStr+'T00:00:00');
  const b = new Date(toStr+'T00:00:00');
  return Math.round((b - a) / 86400000);
}
// birth(YYYY-MM-DD)의 올해(또는 내년) 생일까지 남은 일수
function daysUntilBirthday(birthStr, todayStr_){
  if(!birthStr) return null;
  const mmdd = birthStr.slice(5,10); // MM-DD
  const thisYear = parseInt(todayStr_.slice(0,4),10);
  let next = `${thisYear}-${mmdd}`;
  if(next < todayStr_) next = `${thisYear+1}-${mmdd}`;
  return daysDiff(todayStr_, next);
}
function addDaysStr(dateStr, n){
  let d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) d = new Date(todayStr()+'T00:00:00'); // 잘못된/빈 날짜면 오늘 날짜로 대체
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
// 매장 휴무일: 토·일요일 + 2026년 대한민국 법정공휴일(대체공휴일 포함)
// ※ 매장 휴무 정책이 바뀌면 이 목록만 수정하면 됩니다.
const HOLIDAYS_2026 = new Set([
  '2026-01-01', // 신정
  '2026-02-16','2026-02-17','2026-02-18', // 설날 연휴
  '2026-03-02', // 삼일절 대체공휴일(3/1이 일요일)
  '2026-05-05', // 어린이날
  '2026-05-25', // 부처님오신날 대체공휴일(5/24가 일요일)
  '2026-07-17', // 제헌절
  '2026-08-15','2026-08-17', // 광복절 + 대체공휴일(8/15가 토요일)
  '2026-09-24','2026-09-25','2026-09-26', // 추석 연휴
  '2026-10-03','2026-10-05', // 개천절 + 대체공휴일(10/3이 토요일)
  '2026-10-09', // 한글날
  '2026-12-25', // 크리스마스
]);
function isBusinessDay(dateStr){
  const day = new Date(dateStr+'T00:00:00').getDay(); // 0=일,6=토
  if(day===0 || day===6) return false;
  if(HOLIDAYS_2026.has(dateStr)) return false;
  return true;
}
// 특정 날짜(asOfDate) 기준, 주말·공휴일은 건너뛰고 영업일만 따져서 며칠 연속 출석했는지 계산
function currentStreak(c, asOfDate){
  const visitDates = new Set(c.visits.map(v=>v.date));
  let streak = 0;
  let d = asOfDate;
  let guard = 0;
  while(guard++ < 3650){ // 무한루프 방지 안전장치
    if(isBusinessDay(d)){
      if(visitDates.has(d)){
        streak++;
        d = addDaysStr(d, -1);
      } else {
        break;
      }
    } else {
      d = addDaysStr(d, -1); // 휴무일은 건너뛰고 계속 거슬러 올라감(끊김으로 취급 안 함)
    }
  }
  return streak;
}
// 3일 연속(3,6,9...) 출석 달성일인지 여부 → 3만볼트 이용쿠폰 지급 대상
function isCouponDay(c, asOfDate){
  const s = currentStreak(c, asOfDate);
  return s>0 && s%3===0;
}
// 특정 날짜(asOfDate)까지의 누적 출석일수(서로 다른 날짜 기준)
function totalAttendanceDays(c, asOfDate){
  const dates = new Set((c.visits||[]).map(v=>v.date));
  if(!asOfDate) return dates.size;
  return [...dates].filter(d=>d<=asOfDate).length;
}
// 100일 단위(100,200,300...) 누적 출석 달성일인지 여부
// ※ 보류 중: 다시 켜려면 아래 MILESTONE_FEATURE_ENABLED를 true로 바꾸면 됩니다.
const MILESTONE_FEATURE_ENABLED = false;
function isMilestoneDay(c, asOfDate){
  if(!MILESTONE_FEATURE_ENABLED) return false;
  const d = totalAttendanceDays(c, asOfDate);
  return d>0 && d%100===0;
}
function daysSince(dateStr){
  if(!dateStr) return null;
  const d1 = new Date(dateStr), d2 = new Date(todayStr());
  return Math.round((d2-d1)/86400000);
}
function lastVisit(c){ if(!c.visits.length) return null; return c.visits.map(v=>v.date).sort().slice(-1)[0]; }
function referralCount(name){ return customers.filter(c=>c.referrer && c.referrer.trim()===name.trim()).length; }
// 누적 소개 건수를 3,5,7,9... 홀수 단계 중 달성한 가장 높은 단계로 변환 (2 이하는 null)
function referralTier(total){
  if(total<3) return null;
  return total % 2===1 ? total : total-1;
}
function shiftMonth(prefix, delta){
  let [y,m] = prefix.split('-').map(Number);
  m += delta;
  while(m<1){ m+=12; y--; }
  while(m>12){ m-=12; y++; }
  return y + '-' + String(m).padStart(2,'0');
}
function addBusinessDays(startStr, totalDays){
  let d = new Date(startStr+'T00:00:00');
  if(isNaN(d.getTime())) d = new Date(todayStr()+'T00:00:00'); // 잘못된/빈 날짜면 오늘 날짜로 대체
  let count = 0, guard = 0;
  while(guard++ < 10000){ // 안전장치: 만 번 넘게 돌면 데이터 이상 → 중단
    const dow = d.getDay();
    const ds = d.toISOString().slice(0,10);
    if(dow!==0 && dow!==6 && !KOREAN_HOLIDAYS.has(ds)) count++;
    if(count===totalDays) break;
    d.setDate(d.getDate()+1);
  }
  return d.toISOString().slice(0,10);
}
function threeManEnd(c){ return addBusinessDays(c.threeManStart || c.firstVisit || todayStr(), 5); }
function ddayBadge(endDate){
  const rem = -daysSince(endDate);
  if(rem>0) return {text:`D-${rem}`, cls:'badge'};
  if(rem===0) return {text:'오늘 마감', cls:'badge amber'};
  return {text:`기간만료 (${-rem}일 지남)`, cls:'badge coral'};
}

function setStatus(ok, msg){

// 어떤 형태(전체 타임스탬프, 잘못된 값 등)로 들어와도 'YYYY-MM-DD' 형태로 정제.
// 정제 불가능하면 빈 문자열 반환(→ 이후 코드에서 안전하게 fallback 처리됨).
function cleanDateStr(v){
  if(!v) return '';
  const s = String(v).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); // 앞부분 YYYY-MM-DD만 추출 (시간 붙어있어도 OK)
  if(m){
    const y = parseInt(m[1],10);
    if(y < 1900 || y > 2100) return ''; // 말이 안 되는 연도는 거부
    return m[0].slice(0,10);
  }
  // 순수 숫자만 있는 문자열(예: "45000")은 날짜로 취급하지 않음 — new Date()가 연도로 잘못 해석해서
  // 서기 45000년 같은 값이 나오는 걸 막기 위함 (이게 실제로 앱이 멈추는 원인이었음)
  if(/^\d+(\.\d+)?$/.test(s)) return '';
  const d = new Date(s);
  if(isNaN(d.getTime())) return '';
  const y2 = d.getFullYear();
  if(y2 < 1900 || y2 > 2100) return ''; // 연도가 비정상적이면 거부
  return d.toISOString().slice(0,10);
}
// 전화번호를 항상 문자열로, 가능하면 010-XXXX-XXXX 형식으로 통일.
// 구글시트가 전화번호를 숫자 타입으로 돌려줘도(예: 1097264790) 절대 죽지 않도록 방어.
function cleanPhoneStr(v){
  if(v===undefined || v===null || v==='') return '';
  let digits;
  if(typeof v === 'number'){
    digits = String(Math.trunc(v));
    if(!digits.startsWith('0')) digits = '0'+digits;
  } else {
    digits = String(v).replace(/\D/g,'');
    if(digits && !digits.startsWith('0')) digits = '0'+digits;
  }
  if(digits.length===11 && digits.startsWith('01')) return digits.slice(0,3)+'-'+digits.slice(3,7)+'-'+digits.slice(7);
  if(digits.length===10 && digits.startsWith('01')) return digits.slice(0,3)+'-'+digits.slice(3,6)+'-'+digits.slice(6);
  return digits || String(v).trim();
}
async function fetchCustomersFromSheet(){
  const res = await fetch(SHEET_API_URL + '?action=list');
  const data = await res.json();
  return (data.customers || []).map(c=>{
    // 기존 calciumDate(단일 날짜)만 있고 calciumPurchases(누적 배열)가 없으면 1회 마이그레이션
    let calciumPurchases = (c.calciumPurchases || []).map(cleanDateStr).filter(Boolean);
    if(!calciumPurchases.length && c.calciumDate) calciumPurchases = [cleanDateStr(c.calciumDate)].filter(Boolean);
    const visits = (c.visits || []).map(v=>({...v, date: cleanDateStr(v.date)})).filter(v=>v.date);
    return {
      ...c,
      name: String(c.name || '').trim(),
      phone: cleanPhoneStr(c.phone),
      birth: cleanDateStr(c.birth),
      threeManStart: cleanDateStr(c.threeManStart),
      fiveManDate: cleanDateStr(c.fiveManDate),
      trialStart: cleanDateStr(c.trialStart),
      purchaseDate: cleanDateStr(c.purchaseDate),
      firstVisit: cleanDateStr(c.firstVisit),
      visits,
      calciumPurchases,
    };
  });
}
async function loadFromSheet(){
  if(!sheetConfigured()){
    setStatus(false, '⚠️ 구글시트 연동이 아직 설정 안 됐어요. 이 상태에서는 자동저장이 안 되니, 하루 마칠 때 꼭 "백업"을 눌러주세요.');
    render();
    return;
  }
  try{
    customers = await fetchCustomersFromSheet();
    setStatus(true, `✅ 구글시트 연동됨 · 20초마다 자동 새로고침 (고객 ${customers.length}명)`);
  }catch(err){
    setStatus(false, '⚠️ 구글시트 연결 실패 — 인터넷 연결을 확인해주세요. 지금 입력하는 내용은 저장이 안 될 수 있어요.');
  }
  render();
  startAutoRefresh();
  checkElectrodeCouponAlerts();
}
function startAutoRefresh(){
  if(!sheetConfigured()) return;
  if(window._refreshTimer) clearInterval(window._refreshTimer);
  window._refreshTimer = setInterval(silentRefresh, 20000);
}
async function silentRefresh(){
  if(!sheetConfigured()) return;
  if(document.querySelector('.modal-bg')) return; // 등록/수정 중이면 방해하지 않음
  const preserve = {};
  ['checkinSearch','custSearch','qrSearch'].forEach(id=>{
    const el = document.getElementById(id);
    if(el && el.value) preserve[id] = el.value;
  });
  try{
    customers = await fetchCustomersFromSheet();
  }catch(err){ return; } // 실패하면 다음 주기에 조용히 재시도
  setStatus(true, `✅ 구글시트 연동됨 · 20초마다 자동 새로고침 (고객 ${customers.length}명)`);
  render();
  checkElectrodeCouponAlerts();
  Object.keys(preserve).forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.value = preserve[id];
    if(id==='checkinSearch') renderCheckinResults();
    if(id==='custSearch') renderCustomerItems();
    if(id==='qrSearch') renderQrList();
  });
}

  showToast('새로고침 중...');

  showToast('최신 데이터로 갱신됐어요');
}

function renderHome(){
  const today = todayStr();
  const thisMonthPrefix = today.slice(0,7);
  const lastMonthPrefix = shiftMonth(thisMonthPrefix, -1);

  const breakdown = visitors => ({
    total: visitors.length,
    new: visitors.filter(c=>c.firstVisit===today).length,
    vip: visitors.filter(c=>c.purchased).length
  });

  const todayVisitors = customers.filter(c=>c.visits.some(v=>v.date===today));
  const amVisitors = customers.filter(c=>c.visits.some(v=>v.date===today && v.session==='오전'));
  const pmVisitors = customers.filter(c=>c.visits.some(v=>v.date===today && v.session==='오후'));

  const todayStat = breakdown(todayVisitors);
  const amStat = breakdown(amVisitors);
  const pmStat = breakdown(pmVisitors);

  const thisMonthReg = customers.filter(c=>c.firstVisit && c.firstVisit.startsWith(thisMonthPrefix));
  const thisMonthRegToday = thisMonthReg.filter(c=>c.visits.some(v=>v.date===today)).length;
  const thisMonthRate = thisMonthReg.length ? Math.round(thisMonthRegToday/thisMonthReg.length*1000)/10 : null;

  const lastMonthReg = customers.filter(c=>c.firstVisit && c.firstVisit.startsWith(lastMonthPrefix));
  const lastMonthRegToday = lastMonthReg.filter(c=>c.visits.some(v=>v.date===today)).length;
  const lastMonthRate = lastMonthReg.length ? Math.round(lastMonthRegToday/lastMonthReg.length*1000)/10 : null;

  // 소개왕 TOP5: 이번 달에 새로 등록한 고객들의 소개자만 집계 (매달 새로 시상 가능)
  const thisMonthNewCustomers = customers.filter(c=>c.firstVisit && c.firstVisit.startsWith(thisMonthPrefix));
  const referralCountThisMonth = name => thisMonthNewCustomers.filter(c=>c.referrer && c.referrer.trim()===name.trim()).length;
  const topReferrers = [...new Set(thisMonthNewCustomers.map(c=>c.referrer).filter(Boolean))]
    .map(name=>({name, count:referralCountThisMonth(name), total:referralCount(name)}))
    .filter(x=>x.count>0).sort((a,b)=>b.count-a.count).slice(0,5);

  // 누적 소개 건수가 홀수(3,5,7,9...)에 도달한 시상 대상자 (매번 반복 시상)
  const allReferrerNames = [...new Set(customers.map(c=>c.referrer).filter(Boolean).map(r=>r.trim()))];
  const referrerTotals = allReferrerNames.map(name=>({name, total:referralCount(name)})).filter(x=>x.total>0);
  const oddMilestoneReferrers = referrerTotals.filter(x=>x.total>=3 && x.total%2===1).sort((a,b)=>b.total-a.total);

  const calciumToday = customers.filter(c=>(c.calciumPurchases||[]).includes(today));
  const calciumThisMonthCustomers = customers.filter(c=>(c.calciumPurchases||[]).some(d=>d.startsWith(thisMonthPrefix)));
  const calciumThisMonthCount = customers.reduce((sum,c)=>sum+(c.calciumPurchases||[]).filter(d=>d.startsWith(thisMonthPrefix)).length, 0);

  const vipTodayList = todayVisitors.filter(c=>c.purchased);

  // 오늘 방문자 중 7일 이상 결석 후 복귀한 고객
  const returningToday = todayVisitors.map(c=>{
    const priorVisits = c.visits.filter(v=>v.date<today);
    if(!priorVisits.length) return null;
    const lastPrior = priorVisits.reduce((max,v)=> v.date>max ? v.date : max, priorVisits[0].date);
    const gap = daysDiff(lastPrior, today);
    return gap>=7 ? {c, lastPrior, gap} : null;
  }).filter(Boolean).sort((a,b)=>b.gap-a.gap);

  // 생일 임박 VIP (14일 이내)
  const BIRTHDAY_WINDOW = 14;
  const upcomingBirthdayVips = customers.filter(c=>c.purchased && c.birth).map(c=>{
    const d = daysUntilBirthday(c.birth, today);
    return {c, d};
  }).filter(x=>x.d!==null && x.d<=BIRTHDAY_WINDOW).sort((a,b)=>a.d-b.d);

  const statBlock = (title, s) => `

        <div class="stat"><div class="n">${s.total}</div><div class="l">합계</div></div>
      </div>
    </div>`;

    ${statBlock('① 오늘 총 인원', todayStat)}
    ${statBlock('② 오전 총 인원', amStat)}
    ${statBlock('③ 오후 총 인원', pmStat)}

    <div class="card">
      <h3>④ 이번달 등록 후 오늘 방문</h3>
      <div class="row"><span class="sub">이번달 등록인원</span><span>${thisMonthReg.length}명</span></div>
      <div class="row"><span class="sub">오늘 방문</span><span>${thisMonthRegToday}명</span></div>
      <div class="row"><span class="sub">비율</span><span class="badge amber">${thisMonthRate!==null?thisMonthRate+'%':'-'}</span></div>
    </div>

    <div class="card">
      <h3>⑤ 지난달 등록 후 오늘 방문</h3>
      <div class="row"><span class="sub">지난달 등록인원</span><span>${lastMonthReg.length}명</span></div>
      <div class="row"><span class="sub">오늘 방문</span><span>${lastMonthRegToday}명</span></div>
      <div class="row"><span class="sub">비율</span><span class="badge amber">${lastMonthRate!==null?lastMonthRate+'%':'-'}</span></div>
    </div>

      <div class="list-scroll">
      ${topReferrers.length ? topReferrers.map((x,i)=>`
        <div class="row"><div class="name">${i+1}. ${x.name}</div><span class="badge amber">이달 ${x.count}명 · 누적 ${x.total}명</span></div>
      `).join('') : '<div class="empty">아직 소개 데이터가 없어요</div>'}
      </div>
    </div>

    <div class="card" style="border:2px solid var(--amber-light); background:#FFFDF7;">
      <h3>🎁 소개 시상 대상자 (누적 3,5,7,9...명 달성)</h3>
      <div class="list-scroll">
      ${oddMilestoneReferrers.length ? oddMilestoneReferrers.map(x=>`

      `).join('') : '<div class="empty">해당자가 없어요</div>'}
      </div>
    </div>

    <div class="card">
      <h3>👑 ⑦ 출석한 VIP (${vipTodayList.length}명)</h3>
      <div class="list-scroll">
      ${vipTodayList.length ? vipTodayList.map(c=>`
        <div class="row"><span class="name">${c.name}</span><span class="sub">${c.purchaseModel||''}</span></div>

    <div class="card">

      <div class="list-scroll">

function setSession(s){ checkinSession = s; renderCheckin(); }
// 스캐너가 QR 종류를 나타내는 보이지 않는 접두어(예: "]Q1")를 값 앞에 붙이는 경우가 있어서,
// 우리 id 형식(c로 시작하는 영문+숫자)만 뽑아내서 매칭 시도. 앞뒤에 이상한 문자가 섞여있어도 방어됨.
// ---- 한/영 모드가 잘못되어 한글로 깨진 스캔값을 원래 영문 키입력으로 복원 ----
// (2벌식 자판 기준. 예: "츠네" -> "cm" 로 복원)
const HG_INITIAL = ['r','R','s','e','E','f','a','q','Q','t','T','d','w','W','c','z','x','v','g'];
const HG_MEDIAL  = ['k','o','i','O','j','p','u','P','h','hk','ho','hl','y','n','nj','np','nl','b','m','ml','l'];
const HG_FINAL   = ['','r','R','rt','s','sw','sg','e','f','fr','fa','fq','ft','fx','fv','fg','a','q','qt','t','T','d','w','c','z','x','v','g'];
const HG_LONE_CONSONANT = ['r','R','rt','s','sw','sg','e','E','f','fr','fa','fq','ft','fx','fv','fg','a','q','Q','qt','t','T','d','w','W','c','z','x','v','g'];
const HG_LONE_VOWEL = ['k','o','i','O','j','p','u','P','h','hk','ho','hl','y','n','nj','np','nl','b','m','ml','l'];
function hangulToQwerty(str){
  let out = '';
  for(const ch of String(str||'')){
    const code = ch.codePointAt(0);
    if(code>=0xAC00 && code<=0xD7A3){
      const s = code - 0xAC00;
      const l = Math.floor(s/(21*28)), v = Math.floor((s%(21*28))/28), t = s%28;
      out += (HG_INITIAL[l]||'') + (HG_MEDIAL[v]||'') + (HG_FINAL[t]||'');
    } else if(code>=0x3131 && code<=0x314E){
      out += HG_LONE_CONSONANT[code-0x3131] || ch;
    } else if(code>=0x314F && code<=0x3163){
      out += HG_LONE_VOWEL[code-0x314F] || ch;
    } else {
      out += ch;
    }
  }
  return out;
}
function extractCustomerId(raw){
  const s = String(raw||'').trim();
  let m = s.match(/c[a-z0-9]{8,}/i);
  if(m) return m[0];
  // 한글로 깨진 경우, 원래 영문키로 복원해서 다시 시도
  const converted = hangulToQwerty(s);
  m = converted.match(/c[a-z0-9]{8,}/i);
  return m ? m[0] : s;
}
function handleScanInput(e){
  if(e.key !== 'Enter') return;
  const raw = e.target.value;
  e.target.value = '';
  const val = extractCustomerId(raw);
  if(!val) return;
  const c = customers.find(x=>x.id===val);
  if(!c){ showToast(`등록되지 않은 QR이에요 (스캔값: ${raw.trim()})`); return; }
  doCheckin(c.id);
}
// Enter 키를 안 보내는 스캐너 대응: 입력이 잠깐(150ms) 멈추면 자동으로 체크인 시도.
// 사람이 손으로 타이핑하는 속도보다 훨씬 빠르게 값이 채워지는 스캐너의 특성을 이용.
window._scanDebounceTimer = null;
function handleScanInputDebounced(e){
  const el = e.target;
  clearTimeout(window._scanDebounceTimer);
  window._scanDebounceTimer = setTimeout(()=>{
    const raw = el.value;
    const val = extractCustomerId(raw);
    if(!val) return;
    const c = customers.find(x=>x.id===val);
    if(!c) return; // 사람이 직접 타이핑 중일 수도 있으니, 못 찾았다고 바로 에러 띄우지 않음
    el.value = '';
    doCheckin(c.id);
  }, 150);
}
function renderCheckinResults(){
  const q = (document.getElementById('checkinSearch')?.value || '').trim();
  const box = document.getElementById('checkinResults');
  if(!q){ box.innerHTML=''; return; }
  const results = customers.filter(c => c.name.includes(q) || c.phone.replace(/-/g,'').includes(q));
  if(!results.length){ box.innerHTML = '<div class="empty">검색 결과가 없어요. 고객관리 탭에서 새로 등록해주세요.</div>'; return; }
  box.innerHTML = results.map(c=>{
    const already = c.visits.some(v=>v.date===todayStr() && v.session===checkinSession);
    return `<div class="cust-item" onclick="doCheckin('${c.id}')">
      <div class="info"><div class="nm">${c.name} ${c.purchased?'<span class=\"badge vip\">VIP</span>':''}</div><div class="meta">${c.phone} · 소개: ${c.referrer||'-'}</div></div>
      ${already?'<span class="badge">체크완료</span>':'<span class="badge amber">탭해서 체크</span>'}
    </div>`;
  }).join('');
}
function doCheckin(id){
  if(isViewer()){ showToast('열람 전용 모드에서는 체크인할 수 없어요'); return; }
  const c = customers.find(x=>x.id===id);
  if(!c) return;
  const today = todayStr();
  const already = c.visits.some(v=>v.date===today && v.session===checkinSession);
  if(already){ showToast(`${c.name}님은 이미 ${checkinSession} 출석 완료`); refocusScan(); return; }

  // 체크인 전, 직전 방문일과의 간격을 먼저 확인 (7일 이상 결석 후 복귀 감지)
  const priorVisits = c.visits.filter(v=>v.date<today);
  let returnGap = null, lastPriorDate = null;
  if(priorVisits.length){
    lastPriorDate = priorVisits.reduce((max,v)=> v.date>max ? v.date : max, priorVisits[0].date);
    returnGap = daysDiff(lastPriorDate, today);
  }

  c.visits.push({date:today, session:checkinSession, time:new Date().toTimeString().slice(0,5)});
  showToast(`${c.name}님 ${checkinSession} 출석 완료!`);
  syncCustomer(c);
  const s = document.getElementById('checkinSearch');
  if(s) s.value='';
  renderCheckinResults();
  renderCheckinLog();
  refocusScan();

  if(returnGap!==null && returnGap>=7){
    showReturnAlert(c, returnGap, lastPriorDate);
  }
  if(c.birth){
    const bd = daysUntilBirthday(c.birth, today);
    if(bd===0) showBirthdayAlert(c);
  }
  if(isCouponDay(c, today)){
    showCouponAlert(c, currentStreak(c, today));
  }
  if(isMilestoneDay(c, today)){
    showMilestoneAlert(c, totalAttendanceDays(c, today));
  }
}

function weeklyAttendanceForMonth(c, yearMonthStr){
  const today = todayStr();
  const [y,m] = yearMonthStr.split('-').map(Number);
  const isCurrentMonth = yearMonthStr === today.slice(0,7);
  const todayDay = parseInt(today.slice(8,10),10);
  const daysInMonth = new Date(y, m, 0).getDate();
  const maxDay = isCurrentMonth ? todayDay : daysInMonth;
  const buckets = {};
  for(let d=1; d<=maxDay; d++){
    const b = Math.ceil(d/7);
    buckets[b] = buckets[b] || new Set();
  }
  c.visits.filter(v=>v.date.startsWith(yearMonthStr)).forEach(v=>{
    const day = parseInt(v.date.slice(8,10),10);
    if(day>maxDay) return;
    const b = Math.ceil(day/7);
    buckets[b] = buckets[b] || new Set();
    buckets[b].add(v.date);
  });
  return Object.keys(buckets).map(Number).sort((a,b)=>a-b).map(b=>({week:b, count:buckets[b].size}));
}

function setStatMode(m){ statMode = m; renderStats(); }
function lastVisitDate(c){
  if(!c.visits || !c.visits.length) return c.firstVisit || null;
  return c.visits.reduce((max,v)=> v.date>max ? v.date : max, c.visits[0].date);
}
// weekIndex번째 주(등록일 기준)에 4일 이상 출석했는지 확인
function attendedInWeek(c, weekIndex){
  const start = addDaysStr(c.firstVisit, (weekIndex-1)*7);
  const end = addDaysStr(c.firstVisit, weekIndex*7 - 1);
  const dates = new Set(c.visits.filter(v=>v.date>=start && v.date<=end).map(v=>v.date));
  return dates.size >= 4;
}
function computeRetentionWindow(cohort, weekIndex){
  const today = todayStr();
  const dayThreshold = weekIndex*7 - 1; // 해당 주가 완전히 지났는지 판단하는 경과일수
  const eligible = cohort.filter(c => daysDiff(c.firstVisit, today) >= dayThreshold);
  const retained = eligible.filter(c => attendedInWeek(c, weekIndex));
  return {
    total: eligible.length,
    retained: retained.length,
    rate: eligible.length ? Math.round(retained.length/eligible.length*1000)/10 : null
  };
}
// 소개자의 첫방문일 대비, 피소개자가 실제 등록(첫방문)하기까지 걸린 기간 분석
function computeReferralTiming(prefix){
  const referredInRange = customers.filter(c=>c.referrer && c.firstVisit && c.firstVisit.startsWith(prefix));
  const gaps = [];
  referredInRange.forEach(c=>{
    // 이름으로 소개자 고객 레코드 매칭 (동명이인이 있으면 첫 번째 매칭 사용)
    const referrerCust = customers.find(x=>x.name===c.referrer);
    if(!referrerCust || !referrerCust.firstVisit) return;
    const gap = daysDiff(referrerCust.firstVisit, c.firstVisit);
    if(gap>=0) gaps.push({referred:c, referrer:referrerCust, gap});
  });
  if(!gaps.length) return {count:0, avg:null, buckets:null};
  const avg = Math.round(gaps.reduce((s,g)=>s+g.gap,0)/gaps.length);
  const buckets = {
    '30일 이내': gaps.filter(g=>g.gap<=30).length,
    '31~60일': gaps.filter(g=>g.gap>30 && g.gap<=60).length,
    '61~90일': gaps.filter(g=>g.gap>60 && g.gap<=90).length,
    '90일 초과': gaps.filter(g=>g.gap>90).length,
  };
  return {count:gaps.length, avg, buckets};
}
function computeRetention(prefix){
  const cohort = customers.filter(c=>c.firstVisit && c.firstVisit.startsWith(prefix));
  const w2 = computeRetentionWindow(cohort, 2);   // 2주
  const w4 = computeRetentionWindow(cohort, 4);   // 한달(4주)
  const w8 = computeRetentionWindow(cohort, 8);   // 두달(8주)

  // 한 달(30일) 이상 다닌 고객 중 현재 5일 이상 연속 결석 중인 명단
  const today = todayStr();
  const monthPlusCustomers = cohort.filter(c => daysDiff(c.firstVisit, today) >= 30);
  const absentees = monthPlusCustomers.map(c=>{
    const lv = lastVisitDate(c);
    const gap = lv ? daysDiff(lv, today) : null;
    return {c, lv, gap};
  }).filter(x=>x.gap!==null && x.gap>=5).sort((a,b)=>b.gap-a.gap);

  return {w2, w4, w8, absentees};
}

function exportStatsCsv(){
  const prefix = statMode==='month' ? statMonth : statYear;
  const visitsInRange = customers.flatMap(c=>c.visits.filter(v=>v.date.startsWith(prefix)).map(v=>({...v, cust:c}))).sort((a,b)=>a.date.localeCompare(b.date));
  let csv = '\uFEFF날짜,시간대,고객명,전화번호,소개자,VIP여부\n';
  visitsInRange.forEach(v=>{ csv += `${v.date},${v.session},${v.cust.name},${v.cust.phone},${v.cust.referrer||''},${v.cust.purchased?'VIP':'일반'}\n`; });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `헬스트론_방문기록_${prefix}.csv`; a.click();
  URL.revokeObjectURL(url);
  showToast('CSV 파일이 다운로드됐어요');
}

/* ---------------- 시간대별 (30분 단위) ---------------- */
let timelineDate = todayStr();

function timeSlotLabel(timeStr){
  if(!timeStr) return '시간 미기록';
  const [h,m] = timeStr.split(':').map(Number);
  const slotM = m<30 ? 0 : 30;
  let endH = h, endM = slotM===0 ? 30 : 0;
  if(slotM===30) endH = h+1;
  const pad = n=>String(n).padStart(2,'0');
  return `${pad(h)}:${pad(slotM)} ~ ${pad(endH)}:${pad(endM)}`;
}
function timeSlotSortKey(label){
  if(label==='시간 미기록') return 9999;
  const [hh,mm] = label.split('~')[0].trim().split(':').map(Number);
  return hh*60+mm;
}
function toggleVisitConfirmed(customerId, date, session){
  const c = customers.find(x=>x.id===customerId);
  if(!c) return;
  const v = c.visits.find(x=>x.date===date && x.session===session);
  if(!v) return;
  v.confirmed = !v.confirmed;
  syncCustomer(c);
  renderTimelineBody();
}
function renderTimeline(){
  document.getElementById('main').innerHTML = `
    <h2 class="section-title">시간대별 출석 (30분 단위)</h2>
    <div class="card"><label class="field"><span>조회할 날짜</span><input type="date" id="timelineDateInput" value="${timelineDate}" onchange="timelineDate=this.value; renderTimelineBody();"></label></div>
    <div id="timelineBody"></div>
  `;
  renderTimelineBody();
}
function renderTimelineBody(){
  const box = document.getElementById('timelineBody');
  const visits = customers.flatMap(c=>c.visits.filter(v=>v.date===timelineDate).map(v=>({...v, cust:c})));
  if(!visits.length){ box.innerHTML = '<div class="empty">이 날짜에 출석한 고객이 없어요</div>'; return; }

  const couponToday = [...new Map(visits.map(v=>[v.cust.id, v.cust])).values()]
    .filter(c=>isCouponDay(c, timelineDate))
    .map(c=>({c, streak:currentStreak(c, timelineDate)}));

  const groups = {};
  visits.forEach(v=>{
    const label = timeSlotLabel(v.time);
    if(!groups[label]) groups[label] = [];
    groups[label].push(v);
  });
  const labels = Object.keys(groups).sort((a,b)=>timeSlotSortKey(a)-timeSlotSortKey(b));

  box.innerHTML = `
    <div class="card" style="border:2px solid var(--amber-light); background:#FFFDF7;">
      <h3>🎟️ 오늘 3만볼트 쿠폰 대상자 (${couponToday.length}명)</h3>
      ${couponToday.length ? couponToday.map(x=>`
        <div class="row"><span class="name">${x.c.name} ${x.c.purchased?'<span class="badge vip">VIP</span>':''}</span><span class="sub">${x.streak}일 연속</span></div>
      `).join('') : '<div class="empty">오늘 쿠폰 대상자가 없어요</div>'}
    </div>
  ` + labels.map(label=>{
    const list = groups[label].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const confirmedCount = list.filter(v=>v.confirmed).length;
    return `<div class="slot-card">
      <div class="slot-head"><span>🕐 ${label}</span><span class="cnt">${confirmedCount}/${list.length}명 확인</span></div>
      ${list.map(v=>`<div class="slot-name" style="${v.confirmed?'opacity:0.55;':''}">
        <span onclick="openCustomerDetail('${v.cust.id}')" style="cursor:pointer; ${v.confirmed?'text-decoration:line-through;':''}">${v.cust.name} ${v.cust.purchased?'<span class="badge vip">VIP</span>':''} ${isCouponDay(v.cust, v.date)?`<span class="badge amber">🎟️ 3일연속(${currentStreak(v.cust, v.date)}일)</span>`:''} ${isMilestoneDay(v.cust, v.date)?`<span class="badge" style="background:#FFF3CD; color:#8A6D00;">🏆 누적${totalAttendanceDays(v.cust, v.date)}일</span>`:''} ${electrodeJustCompletedToday(v.cust, v.date).map(s=>`<span class="badge" style="background:#E3EEE8; color:#2F5D45;">🦵 ${s.type}쿠폰(${s.index}구간)</span>`).join('')} ${(v.cust.birth && daysUntilBirthday(v.cust.birth, v.date)===0)?'<span class="badge-birthday">🎂 생일</span>':''} ${(v.cust.calciumPurchases||[]).includes(v.date)?`<span class="badge amber">💊 오늘구매(누적${v.cust.calciumPurchases.length})</span>`:((v.cust.calciumPurchases||[]).length?`<span class="badge">💊 누적${v.cust.calciumPurchases.length}</span>`:'')}</span>
        <span style="display:flex; align-items:center; gap:8px;">
          <span class="t">${v.time||''}</span>
          <button class="btn-mini" style="background:${v.confirmed?'#7BAE7F':'#ccc'};" onclick="event.stopPropagation(); toggleVisitConfirmed('${v.cust.id}','${v.date}','${v.session}')">${v.confirmed?'✅ 확인됨':'⬜ 확인'}</button>
        </span>
      </div>`).join('')}
    </div>`;
  }).join('');
}

/* ---------------- 엑셀로 고객 일괄 등록 ---------------- */
function excelDateToStr(val){
  if(val === undefined || val === null || val === '') return '';
  if(val instanceof Date) return val.toISOString().slice(0,10);
  if(typeof val === 'number'){
    // 엑셀 날짜 시리얼 번호 처리
    const d = XLSX.SSF.parse_date_code(val);
    if(!d) return '';
    return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  const s = String(val).trim();
  // 이미 YYYY-MM-DD 형태면 그대로, 아니면 Date 파싱 시도
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const parsed = new Date(s);
  if(!isNaN(parsed.getTime())) return parsed.toISOString().slice(0,10);
  return '';
}
async function handleExcelImport(e){
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = ''; // 같은 파일 다시 선택 가능하도록 초기화

  const reader = new FileReader();
  reader.onload = async function(evt){
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const sheetName = wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:''});

      if(!rows.length){ alert('엑셀에 데이터가 없어요.'); return; }

      // 전화번호를 010-XXXX-XXXX 형식으로 통일 (숫자만 들어와도 자동 보정)
      function cleanPhone(v){
        if(v===undefined || v===null || v==='') return '';
        let digits;
        if(typeof v === 'number'){
          digits = String(Math.trunc(v));
          if(!digits.startsWith('0')) digits = '0'+digits;
        } else {
          digits = String(v).replace(/\D/g,'');
          if(digits && !digits.startsWith('0')) digits = '0'+digits;
        }
        if(digits.length===11 && digits.startsWith('01')) return digits.slice(0,3)+'-'+digits.slice(3,7)+'-'+digits.slice(7);
        if(digits.length===10 && digits.startsWith('01')) return digits.slice(0,3)+'-'+digits.slice(3,6)+'-'+digits.slice(6);
        return digits || String(v).trim();
      }

      const toUpdate = [];
      const toCreate = [];
      const skipped = [];
      rows.forEach((row, i)=>{
        const name = String(row['이름']||'').trim();
        const phone = cleanPhone(row['전화번호']);
        if(!name || !phone){ skipped.push(i+2); return; } // 이름/전화번호 없으면 건너뜀 (엑셀 실제 행번호는 헤더+1)

        const existing = customers.find(c=>c.phone===phone);

        // 엑셀 값이 채워진 항목만 반영(빈 칸은 기존 값을 지우지 않음)
        const patch = {};
        const setIfPresent = (key, val) => { if(val!==''&&val!==undefined&&val!==null) patch[key]=val; };
        setIfPresent('name', name);
        setIfPresent('birth', excelDateToStr(row['생년월일']));
        setIfPresent('healthTag', String(row['건강관심사']||'').trim());
        setIfPresent('threeManStart', excelDateToStr(row['3만볼트시작일']));
        setIfPresent('fiveManDate', excelDateToStr(row['5만볼트가능일']));
        setIfPresent('referrer', String(row['소개자']||'').trim());
        if(String(row['구매여부']||'').trim()!=='') patch.purchased = String(row['구매여부']).trim().toUpperCase()==='TRUE';
        setIfPresent('purchaseDate', excelDateToStr(row['구매일']));
        setIfPresent('purchaseModel', String(row['구매모델']||'').trim());
        setIfPresent('memo', String(row['메모']||'').trim());

        if(existing){
          toUpdate.push(Object.assign({}, existing, patch, {phone})); // id/firstVisit/visits/calciumPurchases 등은 기존 값 유지
        } else {
          const firstVisit = excelDateToStr(row['첫방문일']) || todayStr();
          toCreate.push(Object.assign({
            id: uid(), name, phone,
            birth: '', healthTag: '', threeManStart: firstVisit, fiveManDate: '',
            referrer: '', referralBenefitUsed: false, trialDisplay: false, trialStart: '',
            purchased: false, purchaseDate: '', purchaseModel: '',
            calciumDate: '', calciumPurchases: [], memo: '',
            firstVisit, visits: [],
          }, patch)); // 엑셀에 채워진 값으로 위 기본값 덮어씀
        }
      });

      if(!toUpdate.length && !toCreate.length){ alert('처리할 수 있는 행이 없어요. 이름/전화번호가 채워졌는지 확인해주세요.'); return; }

      const ok = confirm(`신규 등록 ${toCreate.length}명, 기존 고객 업데이트 ${toUpdate.length}명입니다.${skipped.length?` (이름/전화번호 없는 ${skipped.length}개 행은 건너뜀)`:''}\n계속할까요?`);
      if(!ok) return;

      showToast(`저장 중... (${toCreate.length+toUpdate.length}명, 잠시만 기다려주세요)`);
      toCreate.forEach(c=> customers.push(c));
      toUpdate.forEach(c=>{
        const idx = customers.findIndex(x=>x.id===c.id);
        if(idx!==-1) customers[idx] = c;
      });
      try{
        const res = await fetch(SHEET_API_URL, {
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({action:'batchUpsert', customers:[...toCreate, ...toUpdate]})
        });
        const result = await res.json();
        if(!result.ok) throw new Error(result.error || '알 수 없는 오류');
        showToast(`✅ 완료! 신규 ${toCreate.length}명 · 업데이트 ${toUpdate.length}명`);
      }catch(saveErr){
        alert('구글시트 저장 중 문제가 생겼어요. 인터넷 연결을 확인하고 다시 시도해주세요.\n(' + saveErr.message + ')');
      }
      renderCustomerList();
    }catch(err){
      alert('엑셀 파일을 읽는 중 문제가 생겼어요. 양식이 맞는지 확인해주세요.\n(' + err.message + ')');
    }
  };
  reader.readAsArrayBuffer(file);
}

  };

});
