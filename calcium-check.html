<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>헬스트론 칼슘·물 케어</title>
<style>
  :root{
    --bg:#F5FAF8;
    --card:#FFFFFF;
    --primary:#1B6B63;
    --primary-dark:#124F49;
    --accent:#D98E3D;
    --success:#2F8F7A;
    --success-bg:#E5F3EF;
    --text:#24312E;
    --text-soft:#657873;
    --border:#DCEAE6;
    --now-badge:#1B6B63;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Pretendard",sans-serif;
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column;}
  header{padding:26px 24px 6px; text-align:center;}
  header .brand{font-size:14px; color:var(--text-soft); margin-bottom:4px;}
  header h1{font-size:21px; margin:0; color:var(--primary-dark); font-weight:800;}
  header .date{margin-top:8px; font-size:15px; color:var(--text-soft);}

  main{flex:1; padding:8px 20px 40px;}

  /* 로그인 */
  .login-card{
    background:var(--card); border-radius:20px; padding:28px 22px; margin-top:24px;
    box-shadow:0 2px 10px rgba(27,107,99,0.08);
  }
  .login-card p{font-size:17px; line-height:1.6; margin:0 0 22px; font-weight:600;}
  label{display:block; font-size:15px; color:var(--text-soft); margin:16px 0 8px; font-weight:600;}
  input[type=text], input[type=tel]{
    width:100%; font-size:20px; padding:16px 14px; border:2px solid var(--border);
    border-radius:12px; outline:none; background:#FBFDFC;
  }
  input:focus{border-color:var(--primary);}
  .btn{
    display:block; width:100%; border:none; border-radius:14px; padding:18px;
    font-size:19px; font-weight:800; cursor:pointer; margin-top:22px;
  }
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:active{background:var(--primary-dark);}

  /* 요약 */
  .day-summary{
    text-align:center; margin:18px 0 6px; font-size:15px; color:var(--text-soft);
  }
  .day-summary b{color:var(--primary-dark); font-size:17px;}

  /* 미션 카드 */
  .mission-card{
    background:var(--card); border-radius:18px; padding:16px; margin:18px 0 14px;
    box-shadow:0 2px 8px rgba(27,107,99,0.06);
  }
  .mission-card .m-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .mission-card .m-title{font-size:14px; font-weight:800;}
  .mission-card .m-day{font-size:12px; color:#0F6E56; font-weight:700;}
  .mission-card .m-track{background:#EFF6F4; border-radius:8px; height:10px; overflow:hidden;}
  .mission-card .m-fill{background:#0F6E56; height:100%; border-radius:8px;}
  .mission-card .m-range{display:flex; justify-content:space-between; margin-top:6px; font-size:10.5px; color:#96a5a1;}
  .mission-card .m-empty{font-size:13.5px; color:var(--text-soft); text-align:center; padding:6px 0;}
  .mission-card .m-ended{text-align:center;}
  .mission-card .m-ended-title{font-size:15px; font-weight:800;}
  .mission-card .m-ended-sub{font-size:12px; color:var(--text-soft); margin-top:6px;}

  /* 오늘의 상태 카드 */
  .status-card{
    background:var(--card); border-radius:18px; padding:18px 16px 14px; margin:18px 0 14px;
    text-align:center; box-shadow:0 2px 8px rgba(27,107,99,0.06);
  }
  .status-card .stamp{font-size:22px; font-weight:800; margin-bottom:2px;}
  .status-card .sub{font-size:12.5px; color:#96a5a1;}

  /* 월간 현황 카드 */
  .month-card{
    background:var(--card); border-radius:18px; padding:16px; margin-bottom:14px;
    box-shadow:0 2px 8px rgba(27,107,99,0.06);
  }
  .month-card .month-title{font-size:14px; font-weight:800; margin-bottom:10px;}
  .tier-chips{display:flex; gap:8px; margin-bottom:14px;}
  .tier-chip{flex:1; border-radius:10px; padding:10px 4px; text-align:center;}
  .tier-chip .val{font-size:16px; font-weight:800;}
  .tier-chip .lab{font-size:10.5px; margin-top:2px;}
  .tier-chip.t3{background:#E1F5EE;} .tier-chip.t3 .val{color:#085041;} .tier-chip.t3 .lab{color:#0F6E56;}
  .tier-chip.t2{background:#EFF6F4;} .tier-chip.t2 .val{color:#0F6E56;} .tier-chip.t2 .lab{color:#5DCAA5;}
  .tier-chip.t1{background:#FAEEDA;} .tier-chip.t1 .val{color:#854F0B;} .tier-chip.t1 .lab{color:#BA7517;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-grid .wd{font-size:10px; color:#96a5a1; text-align:center;}
  .cal-grid .day{
    position:relative; aspect-ratio:1; border-radius:6px; font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center; color:var(--text-soft); background:#F2F0E9;
  }
  .cal-grid .day .flag{position:absolute; top:-6px; right:-4px; font-size:11px;}
  .cal-grid .day.t3{background:#0F6E56; color:#fff;}
  .cal-grid .day.t2{background:#9FE1CB; color:#0F6E56;}
  .cal-grid .day.t1{background:#FAEEDA; color:#854F0B;}
  .cal-grid .day.is-today{border:2px solid var(--primary-dark);}

  /* 시간대 카드 */
  .slot-card{
    background:var(--card); border-radius:18px; padding:20px; margin-bottom:14px;
    box-shadow:0 2px 8px rgba(27,107,99,0.06); border:2px solid transparent;
  }
  .slot-card.is-now{border-color:var(--primary);}
  .slot-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .slot-title{font-size:18px; font-weight:800;}
  .now-badge{
    background:var(--now-badge); color:#fff; font-size:12px; font-weight:700;
    padding:3px 10px; border-radius:10px;
  }
  .item-row{display:flex; gap:10px;}
  .toggle-item{
    flex:1; padding:16px 8px; border-radius:14px; border:2px solid var(--border);
    background:#FBFDFC; text-align:center; cursor:pointer; transition:all .12s;
  }
  .toggle-item .icon{font-size:26px; display:block; margin-bottom:6px;}
  .toggle-item .label{font-size:15px; font-weight:700; color:var(--text-soft);}
  .toggle-item.done{background:var(--success-bg); border-color:var(--success);}
  .toggle-item.done .label{color:var(--success);}

  footer{text-align:center; padding:10px 0 26px;}
  footer a{color:var(--text-soft); font-size:13px; text-decoration:underline;}
  .hidden{display:none !important;}

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--primary-dark); color:#fff; padding:12px 22px; border-radius:20px;
    font-size:14.5px; font-weight:700; opacity:0; transition:all .25s; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">오산 헬스트론</div>
    <h1>칼슘 · 물 케어</h1>
    <div class="date" id="todayLabel"></div>
  </header>

  <main>
    <div id="loginScreen" class="login-card hidden">
      <p>처음 오셨네요!<br>성함과 전화번호를 입력해주세요.</p>
      <label for="nameInput">성함</label>
      <input type="text" id="nameInput" placeholder="예: 홍길동">
      <label for="phoneInput">전화번호</label>
      <input type="tel" id="phoneInput" placeholder="예: 01012345678" inputmode="numeric">
      <button class="btn btn-primary" id="loginBtn">시작하기</button>
    </div>

    <div id="mainScreen" class="hidden">
      <div id="missionCard" class="mission-card"></div>
      <div id="statusCard" class="status-card"></div>
      <div id="monthCard" class="month-card"></div>
      <div id="slotList"></div>
    </div>
  </main>

  <footer>
    <a href="#" id="changePhoneLink">번호 변경</a>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbx4CVpenDkOEw3tupCnYxgSMeaXDoxUZIYna98VPfyIlHsAKX96cfZd_seEPeu-qIUA/exec";

const SLOTS = [
  {id:'morning', title:'아침', from:0, to:11},
  {id:'lunch', title:'점심', from:11, to:17},
  {id:'dinner', title:'저녁', from:17, to:24}
];
const KINDS = [
  {id:'calcium', label:'칼슘', icon:'💊'},
  {id:'water', label:'물', icon:'💧'}
];

function toLocalDateStr(d){
  d = d || new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const todayStr = toLocalDateStr();
document.getElementById('todayLabel').textContent =
  new Date().toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'long'});

function currentSlotId(){
  const h = new Date().getHours();
  const s = SLOTS.find(s => h >= s.from && h < s.to);
  return s ? s.id : SLOTS[0].id;
}

let state = {}; // {morning_calcium:'예'|'', morning_water:'예'|'', ...}
let monthRecords = {}; // {date: record}
let missionInfo = {started:false}; // {started, startDate, endDate, dayIndex, isEnded}

const MISSION_DAYS = 30;

function koLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return `${m}월 ${d}일`;
}

function addDays(dateStr, n){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return toLocalDateStr(dt);
}

function diffDays(fromStr, toStr){
  const [fy,fm,fd] = fromStr.split('-').map(Number);
  const [ty,tm,td] = toStr.split('-').map(Number);
  const a = new Date(fy, fm-1, fd), b = new Date(ty, tm-1, td);
  return Math.round((b - a) / 86400000);
}

const TIER_META = {
  3:{label:'참 잘했어요', emoji:'🌿', cls:'t3'},
  2:{label:'잘했어요', emoji:'🙂', cls:'t2'},
  1:{label:'시작했어요', emoji:'✏️', cls:'t1'},
  0:{label:'', emoji:'', cls:''}
};

function tierForRecord(rec){
  if(!rec) return 0;
  let count = 0;
  SLOTS.forEach(s=>{ if(rec[s.id+'_calcium']==='예' && rec[s.id+'_water']==='예') count++; });
  return count;
}

function getUser(){
  return {
    phone: localStorage.getItem('cw_phone') || '',
    name: localStorage.getItem('cw_name') || ''
  };
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1400);
}

function fieldKey(slotId, kindId){ return `${slotId}_${kindId}`; }

function renderSlots(){
  const nowSlot = currentSlotId();
  const list = document.getElementById('slotList');
  list.innerHTML = '';
  SLOTS.forEach(slot=>{
    const card = document.createElement('div');
    card.className = 'slot-card' + (slot.id===nowSlot ? ' is-now' : '');
    card.innerHTML = `
      <div class="slot-head">
        <div class="slot-title">${slot.title}</div>
        ${slot.id===nowSlot ? '<div class="now-badge">지금</div>' : ''}
      </div>
      <div class="item-row">
        ${KINDS.map(k=>{
          const key = fieldKey(slot.id, k.id);
          const done = state[key] === '예';
          return `<div class="toggle-item ${done?'done':''}" data-key="${key}">
            <span class="icon">${k.icon}</span>
            <span class="label">${k.label} ${done?'완료':''}</span>
          </div>`;
        }).join('')}
      </div>
    `;
    list.appendChild(card);
  });
  list.querySelectorAll('.toggle-item').forEach(el=>{
    el.addEventListener('click', ()=>onToggle(el.dataset.key));
  });
  renderStatus();
  renderMonthCard();
}

function renderStatus(){
  const tier = tierForRecord(state);
  const meta = TIER_META[tier];
  const totalDone = SLOTS.filter(s => state[s.id+'_calcium']==='예' && state[s.id+'_water']==='예').length;
  const card = document.getElementById('statusCard');
  if(tier === 0){
    card.innerHTML = `<div class="stamp" style="color:var(--text-soft);">오늘 체크를 시작해보세요</div><div class="sub">아래에서 시간대별로 체크할 수 있어요</div>`;
  }else{
    card.innerHTML = `<div class="stamp" style="color:#0F6E56;">${meta.label} ${meta.emoji}</div><div class="sub">오늘 ${totalDone} / 3 시간대 완료</div>`;
  }
}

function renderMonthCard(){
  const [y, m] = todayStr.split('-').map(Number);
  const dCount = new Date(y, m, 0).getDate();
  const firstWeekday = new Date(y, m-1, 1).getDay();
  const counts = {3:0, 2:0, 1:0};
  let cells = '';
  for(let d=1; d<=dCount; d++){
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = dateStr === todayStr ? state : monthRecords[dateStr];
    const tier = tierForRecord(rec);
    if(dateStr <= todayStr && tier > 0) counts[tier]++;
    const cls = dateStr > todayStr ? '' : (TIER_META[tier].cls || '');
    const todayCls = dateStr === todayStr ? ' is-today' : '';
    let flag = '';
    if(missionInfo.started){
      if(dateStr === missionInfo.startDate) flag = '<span class="flag">🚩</span>';
      else if(dateStr === missionInfo.endDate) flag = '<span class="flag">🏁</span>';
    }
    cells += `<div class="day ${cls}${todayCls}">${d}${flag}</div>`;
  }
  const wdHtml = ['일','월','화','수','목','금','토'].map(w => `<div class="wd">${w}</div>`).join('');
  const offset = Array.from({length: firstWeekday}, () => '<div></div>').join('');
  document.getElementById('monthCard').innerHTML = `
    <div class="month-title">${m}월 실천 현황</div>
    <div class="tier-chips">
      <div class="tier-chip t3"><div class="val">${counts[3]}일</div><div class="lab">참 잘했어요</div></div>
      <div class="tier-chip t2"><div class="val">${counts[2]}일</div><div class="lab">잘했어요</div></div>
      <div class="tier-chip t1"><div class="val">${counts[1]}일</div><div class="lab">시작했어요</div></div>
    </div>
    <div class="cal-grid">${wdHtml}${offset}${cells}</div>
  `;
}

async function onToggle(key){
  state[key] = state[key] === '예' ? '' : '예';
  renderSlots();
  showToast(state[key]==='예' ? '저장됐어요 ✔' : '체크 해제됨');
  await saveState();
  if(!missionInfo.started){
    const user = getUser();
    await loadMissionInfo(user);
    renderMissionCard();
    renderMonthCard();
  }
}

async function saveState(){
  const user = getUser();
  const payload = {
    action:'save',
    phone:user.phone,
    name:user.name,
    date:todayStr,
    ...state
  };
  try{
    await fetch(SHEET_API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify(payload)
    });
  }catch(e){ /* 네트워크 오류 시 다음 조작에서 재시도됨 */ }
}

async function loadToday(user){
  try{
    const res = await fetch(`${SHEET_API_URL}?action=getToday&phone=${encodeURIComponent(user.phone)}&date=${todayStr}`);
    const data = await res.json();
    state = data.record || {};
  }catch(e){ state = {}; }
}

async function loadMissionInfo(user){
  try{
    const res = await fetch(`${SHEET_API_URL}?action=getMissionInfo&phone=${encodeURIComponent(user.phone)}`);
    const data = await res.json();
    if(!data.started){
      missionInfo = {started:false};
    }else{
      const endDate = addDays(data.startDate, MISSION_DAYS - 1);
      const dayIndex = diffDays(data.startDate, todayStr) + 1;
      missionInfo = {
        started:true,
        startDate:data.startDate,
        endDate,
        dayIndex,
        isEnded: dayIndex > MISSION_DAYS
      };
    }
  }catch(e){ missionInfo = {started:false}; }
}

function renderMissionCard(){
  const card = document.getElementById('missionCard');
  if(!missionInfo.started){
    card.innerHTML = `<div class="m-empty">첫 체크를 하면 30일 미션이 시작돼요 🚩</div>`;
    return;
  }
  if(missionInfo.isEnded){
    card.innerHTML = `
      <div class="m-ended">
        <div class="m-ended-title">🏁 미션 종료</div>
        <div class="m-ended-sub">${koLabel(missionInfo.startDate)} ~ ${koLabel(missionInfo.endDate)} · 30일 미션을 마쳤어요</div>
      </div>
    `;
    return;
  }
  const clampedDay = Math.min(Math.max(missionInfo.dayIndex,1), MISSION_DAYS);
  const percent = Math.round(clampedDay / MISSION_DAYS * 100);
  card.innerHTML = `
    <div class="m-head">
      <div class="m-title">🚩 칼슘 미션 진행 중</div>
      <div class="m-day">${clampedDay} / ${MISSION_DAYS}일째</div>
    </div>
    <div class="m-track"><div class="m-fill" style="width:${percent}%;"></div></div>
    <div class="m-range">
      <div>시작 ${koLabel(missionInfo.startDate)}</div>
      <div>종료 예정 ${koLabel(missionInfo.endDate)}</div>
    </div>
  `;
}
async function loadMonthData(user){
  try{
    const ym = todayStr.slice(0,7);
    const res = await fetch(`${SHEET_API_URL}?action=getMonthData&phone=${encodeURIComponent(user.phone)}&yearMonth=${ym}`);
    const data = await res.json();
    monthRecords = {};
    (data.records || []).forEach(r => monthRecords[r.date] = r);
  }catch(e){ monthRecords = {}; }
}

async function init(){
  const user = getUser();
  if(!user.phone){
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('mainScreen').classList.add('hidden');
    return;
  }
  await loadToday(user);
  await loadMonthData(user);
  await loadMissionInfo(user);
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainScreen').classList.remove('hidden');
  renderMissionCard();
  renderSlots();
}

document.getElementById('loginBtn').addEventListener('click', ()=>{
  const name = document.getElementById('nameInput').value.trim();
  const phone = document.getElementById('phoneInput').value.trim().replace(/[^0-9]/g,'');
  if(!name){ alert('성함을 입력해주세요.'); return; }
  if(phone.length < 9){ alert('전화번호를 정확히 입력해주세요.'); return; }
  localStorage.setItem('cw_phone', phone);
  localStorage.setItem('cw_name', name);
  init();
});

document.getElementById('changePhoneLink').addEventListener('click', (e)=>{
  e.preventDefault();
  if(confirm('번호를 변경하시겠어요? 다시 처음부터 입력합니다.')){
    localStorage.removeItem('cw_phone');
    localStorage.removeItem('cw_name');
    location.reload();
  }
});

init();
</script>
</body>
</html>
